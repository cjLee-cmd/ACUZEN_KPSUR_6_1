<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-20 Final Output - KPSUR AGENT</title>
    <link rel="stylesheet" href="../css/styles/globals.css">
    <link rel="stylesheet" href="../css/styles/layout.css">
    <link rel="stylesheet" href="../css/styles/components.css">
    <style>
        /* ========== Glassmorphism Output Page Styles ========== */

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Output Container */
        .output-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 24px;
            padding: 24px;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Left Panel - Document Preview */
        .preview-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            animation: fadeInUp 0.5s ease both;
        }

        .preview-header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(16, 185, 129, 0.02));
        }

        .preview-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-info {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(16, 185, 129, 0.06));
            border-left: 4px solid #10B981;
            padding: 16px;
            border-radius: var(--radius-lg);
            backdrop-filter: blur(8px);
        }

        .preview-info-text {
            font-size: 12px;
            color: #065F46;
            line-height: 1.6;
        }

        .preview-info-text strong {
            font-weight: 700;
        }

        .preview-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 6px;
        }

        .zoom-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: var(--radius-md);
        }

        .zoom-btn:hover {
            color: var(--color-primary);
            background: rgba(31, 78, 140, 0.1);
        }

        .zoom-level {
            padding: 0 12px;
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 600;
            min-width: 60px;
            text-align: center;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: rgba(248, 250, 252, 0.5);
        }

        .document-preview {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px 40px;
            min-height: 1000px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }

        .document-preview h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--glass-border);
        }

        .document-preview h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-primary);
            margin: 28px 0 14px 0;
        }

        .document-preview h3 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 22px 0 10px 0;
        }

        .document-preview p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 14px;
        }

        .document-preview .table-wrapper {
            overflow-x: auto;
            margin: 20px 0;
        }

        .document-preview table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            font-size: 13px;
            border-radius: var(--radius-lg);
        }

        .document-preview th {
            background: var(--gradient-primary);
            color: white;
            padding: 14px;
            text-align: left;
            font-weight: 600;
        }

        .document-preview td {
            padding: 14px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
        }

        .document-preview tr:nth-child(even) td {
            background: rgba(241, 245, 249, 0.95);
        }

        /* Dark Mode Table Styles */
        [data-theme="dark"] .document-preview table {
            border: 2px solid #64748b;
            background: #0f172a;
        }

        [data-theme="dark"] .document-preview th {
            background: #1e40af !important;
            color: #ffffff !important;
            border: 1px solid #3b82f6;
            font-weight: 700;
        }

        [data-theme="dark"] .document-preview td {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #475569;
        }

        [data-theme="dark"] .document-preview tr:nth-child(even) td {
            background: #334155 !important;
        }

        /* Right Panel - Export Options */
        .export-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            overflow-y: auto;
            box-shadow: var(--glass-shadow);
            animation: fadeInUp 0.5s ease 0.1s both;
        }

        .export-section {
            margin-bottom: 28px;
        }

        .export-section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .export-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .export-option:hover {
            border-color: var(--color-primary);
            background: rgba(31, 78, 140, 0.05);
            transform: translateX(4px);
        }

        .export-option input[type="radio"],
        .export-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--color-primary);
        }

        .export-option-label {
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .export-option-icon {
            font-size: 20px;
        }

        .format-badge {
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, rgba(31, 78, 140, 0.15), rgba(31, 78, 140, 0.05));
            color: var(--color-primary);
        }

        .file-name-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            font-size: 14px;
            margin-bottom: 10px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .file-name-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(31, 78, 140, 0.1);
        }

        .file-name-preview {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }

        .version-info {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            border: 1px solid var(--glass-border);
        }

        .version-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
        }

        .version-info-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .version-info-label {
            color: var(--text-secondary);
        }

        .version-info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .export-button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .export-btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .export-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }

        .export-btn.primary:hover {
            box-shadow: 0 8px 24px rgba(31, 78, 140, 0.3);
            transform: translateY(-2px);
        }

        .export-btn.secondary {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }

        .export-btn.secondary:hover {
            background: rgba(31, 78, 140, 0.05);
            transform: translateY(-2px);
        }

        .export-history {
            margin-top: 28px;
        }

        .export-history-item {
            padding: 14px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            margin-bottom: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .export-history-item:hover {
            transform: translateX(4px);
            box-shadow: var(--glass-shadow);
        }

        .export-history-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .export-history-meta {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .export-history-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .history-action-btn {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 500;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .history-action-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .submission-panel {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 191, 36, 0.05));
            border: 2px solid #fbbf24;
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(8px);
        }

        .submission-title {
            font-size: 15px;
            font-weight: 700;
            color: #d97706;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .submission-text {
            font-size: 13px;
            color: #92400E;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .submission-checklist {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .submission-checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--glass-border);
        }

        .submission-checklist-item:last-child {
            border-bottom: none;
        }

        .submission-checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #10B981;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] .preview-panel,
        [data-theme="dark"] .export-panel {
            background: rgba(28, 28, 28, 0.8);
            border-color: rgba(80, 80, 80, 0.4);
        }

        [data-theme="dark"] .preview-header {
            background: rgba(28, 28, 28, 0.9);
        }

        [data-theme="dark"] .preview-info {
            background: rgba(16, 185, 129, 0.1);
        }

        [data-theme="dark"] .preview-info-text {
            color: #34d399;
        }

        [data-theme="dark"] .preview-content {
            background: rgba(20, 20, 20, 0.3);
        }

        [data-theme="dark"] .document-preview {
            background: rgba(28, 28, 28, 0.95);
            border-color: rgba(80, 80, 80, 0.5);
        }

        [data-theme="dark"] .document-preview h2 {
            color: #FFFFFF;
        }

        [data-theme="dark"] .zoom-control,
        [data-theme="dark"] .export-option,
        [data-theme="dark"] .version-info,
        [data-theme="dark"] .export-history-item,
        [data-theme="dark"] .file-name-input,
        [data-theme="dark"] .file-name-preview {
            background: rgba(50, 50, 50, 0.6);
            border-color: rgba(80, 80, 80, 0.5);
            color: #D4D4D4;
        }

        [data-theme="dark"] .submission-panel {
            background: rgba(251, 191, 36, 0.1);
        }

        [data-theme="dark"] .submission-title,
        [data-theme="dark"] .submission-text {
            color: #fbbf24;
        }

        [data-theme="dark"] .submission-checklist {
            background: rgba(50, 50, 50, 0.8);
            border-color: rgba(251, 191, 36, 0.3);
        }

        [data-theme="dark"] .format-badge {
            background: rgba(255, 255, 255, 0.1);
            color: #D4D4D4;
        }

        [data-theme="dark"] .export-btn.secondary {
            background: rgba(50, 50, 50, 0.8);
            border-color: #D4D4D4;
            color: #FFFFFF;
        }

        /* ========================================
           Footer Navigation - Glass
           ======================================== */
        .footer-nav {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            z-index: 100;
        }

        .btn-nav {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .btn-nav-prev {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .btn-nav-prev:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            transform: translateX(-2px);
        }

        .btn-nav-next {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-nav-next:hover:not(:disabled) {
            transform: translateY(-2px) translateX(2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        [data-theme="dark"] .footer-nav {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(71, 85, 105, 0.5);
        }

        @media (max-width: 1024px) {
            .output-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Supabase SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- 공통 스크립트 로드 -->
    <script src="../js/config.js"></script>
    <script src="../utils/ui-helpers.js"></script>

    <script src="../js/docx-styles-config.js"></script>

    <script src="../js/supabase-client.js" type="module"></script>

    <!-- Dark Mode Script -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        function toggleDarkMode() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
    </script>

    <!-- Main Script -->
    <script>
        // 전역 의존성 fallback (config.js에서 이미 선언된 경우 재선언하지 않음)
        if (!window.CONFIG) {
            window.CONFIG = {
                SUPABASE_URL: 'https://toelnxgizxwbdikskmxa.supabase.co',
                SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvZWxueGdpenh3YmRpa3NrbXhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkwMDE0MDIsImV4cCI6MjA2NDU3NzQwMn0.LQNQJP93IjNA0PIoYj5UEfcBLgFckAbz_qJHpjlWpL0',
                APP_NAME: 'KPSUR AGENT',
                VERSION: '1.0.0'
            };
        }

        if (!window.Storage) {
            window.Storage = {
                get: (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
                set: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } },
                remove: (key) => { try { localStorage.removeItem(key); return true; } catch { return false; } }
            };
        }

        if (!window.DateHelper) {
            window.DateHelper = {
                format: (date, format = 'YYYY-MM-DD') => {
                    const d = new Date(date);
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const hours = String(d.getHours()).padStart(2, '0');
                    const minutes = String(d.getMinutes()).padStart(2, '0');
                    return format.replace('YYYY', year).replace('MM', month).replace('DD', day).replace('HH', hours).replace('mm', minutes);
                },
                formatISO: (date = new Date()) => date.toISOString(),
                now: () => new Date().toISOString()
            };
        }

        // outputGenerator fallback (hybrid-generator.js에서 로드)
        if (!window.outputGenerator && !window.hybridGenerator) {
            window.outputGenerator = {
                validateReportFormat: (content) => ({ valid: true, issues: [] }),
                addMetadata: (content, metadata) => content,
                generateWordDocument: async (name, content, isDraft) => ({ filename: name + '.docx' }),
                downloadHTML: (name, content, isDraft) => ({ filename: name + '.html' }),
                printToPDF: (name, content, isDraft) => ({ filename: name + '.pdf' }),
                getOutputHistory: () => []
            };
        }

        // 로컬 참조 없이 window.* 직접 사용
        // Storage, DateHelper는 window.Storage, window.DateHelper로 접근
        var outputGenerator = window.hybridGenerator || window.outputGenerator;

        // AppLayout stub class
        class AppLayout {
            constructor(options = {}) {
                this.currentStage = options.currentStage || 0;
                this.reportName = options.reportName || '';
            }

            render(content) {
                return content;
            }

        // 마크다운을 HTML로 변환하는 헬퍼 함수
        function convertMarkdownToHTML(content) {
            // 표 변환 (줄바꿈 변환 전에 먼저 처리)
            content = content.replace(/(\|[^\n]+\|\n)+/g, (tableMatch) => {
                const rows = tableMatch.trim().split('\n');
                let tableHtml = '<div class="table-wrapper"><table>';
                rows.forEach((row, idx) => {
                    const cells = row.split('|').filter(c => c.trim() !== '');
                    // 구분선 (|---|---|) 건너뛰기
                    if (cells.every(c => /^[\s:-]+$/.test(c))) {
                        return;
                    }
                    const isHeader = idx === 0;
                    const tag = isHeader ? 'th' : 'td';
                    const cellsHtml = cells.map(c => '<' + tag + '>' + c.trim() + '</' + tag + '>').join('');
                    tableHtml += '<tr>' + cellsHtml + '</tr>';
                });
                tableHtml += '</table></div>';
                return tableHtml;
            });

            // 기본 마크다운 변환 - 헤더 레벨 순서대로 처리 (높은 레벨부터)
            content = content
                .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
                .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
                .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');

            return content;
        }

        // Generate preview HTML from sections
        function generatePreviewHTML() {
            // 1. generatedSections에서 생성 (우선순위 최상위)
            let sectionsArray = [];

            if (generatedSections) {
                if (Array.isArray(generatedSections)) {
                    sectionsArray = generatedSections;
                } else if (typeof generatedSections === 'object') {
                    // 객체인 경우 값들을 배열로 변환하고 ID 기준 정렬
                    sectionsArray = Object.values(generatedSections).sort((a, b) => {
                        const idA = parseInt(a.id) || 0;
                        const idB = parseInt(b.id) || 0;
                        return idA - idB;
                    });
                }
            }

            if (sectionsArray.length > 0) {
                let html = '<h1>의약품 재심사 안전성 정기보고서</h1>\n';

                sectionsArray.forEach((section) => {
                    if (section && section.content) {
                        // 헬퍼 함수를 사용하여 마크다운 변환
                        const content = convertMarkdownToHTML(section.content);
                        html += `<div class="section-content"><p>${content}</p></div>\n`;
                    }
                });

                return html;
            }

            // 2. draftReport.content가 있으면 사용 (Fallback)
            if (reportContent && reportContent.trim().length > 0) {
                return '<div class="section-content"><p>' + convertMarkdownToHTML(reportContent) + '</p></div>';
            }

            // 3. Fallback - 기본 메시지
            return `
                <h1>의약품 재심사 안전성 정기보고서</h1>
                <div style="text-align: center; padding: 40px; color: #64748b;">

        // Export document
        async function exportDocument() {
            const format = document.querySelector('input[name="exportFormat"]:checked').value;
            const fileName = document.getElementById('fileName').value;
            const isDraft = document.getElementById('saveAsDraft')?.checked || false;

            // outputGenerator 확인 - OutputGenerator 인스턴스 우선 사용
            let generator = window.outputGenerator;
            // validateReportFormat이 없으면 OutputGenerator 클래스에서 새 인스턴스 생성
            if (!generator || typeof generator.validateReportFormat !== 'function') {
                if (window.OutputGenerator) {
                    generator = new window.OutputGenerator();
                    console.log('Created new OutputGenerator instance for export');
                } else {
                    showToast('출력 모듈을 로드하지 못했습니다.', 'error');
                    return;
                }
            }

            showLLMLoading('최종 문서를 생성하고 있습니다...');

            try {
                // 원본 마크다운 콘텐츠 가져오기 (HTML이 아닌 순수 마크다운)
                let content = '';

                // 1. generatedSections에서 마크다운 콘텐츠 결합
                if (generatedSections && Object.keys(generatedSections).length > 0) {
                    // 섹션 번호순 정렬
                    const sortedIds = Object.keys(generatedSections).sort((a, b) => {
                        const numA = parseInt(a.replace(/\D/g, '')) || 0;
                        const numB = parseInt(b.replace(/\D/g, '')) || 0;
                        return numA - numB;
                    });

                    for (const id of sortedIds) {
                        const section = generatedSections[id];
                        if (section && section.content) {
                            content += section.content + '\n\n';
                        }
                    }
                    console.log(`[Export] Combined ${sortedIds.length} sections from generatedSections`);
                }

                // 2. reportContent가 있고 HTML이 아니면 사용
                if (!content || content.trim().length === 0) {
                    if (reportContent && !reportContent.includes('<div') && !reportContent.includes('<h1>')) {
                        content = reportContent;
                        console.log('[Export] Using reportContent (markdown)');
                    }
                }

                // 3. 최종 fallback - 경고와 함께 미리보기 사용 (HTML)
                if (!content || content.trim().length === 0) {
                    const preview = document.getElementById('documentPreview');
                    if (preview) {
                        console.warn('[Export] Falling back to preview innerHTML (HTML content)');
                        content = preview.innerHTML;
                    }
                }

                // 보고서 검증 (내용이 있을 때만)
                if (content && content.length > 100) {
                    const validation = generator.validateReportFormat(content);
                    if (!validation.valid) {
                        // 경고만 표시하고 계속 진행
                        console.warn('Report validation warnings:', validation.issues);
                    }
                }

                // Add metadata
                const metadata = {
                    reportName: fileName,
                    version: '1.0',
                    date: window.DateHelper.formatISO ? window.DateHelper.formatISO() : new Date().toISOString(),
                    author: window.authManager.getCurrentUser()?.name || 'Unknown',
                    isDraft: isDraft
                };

                const contentWithMetadata = generator.addMetadata(content, metadata);

                // Export based on format
                let result;
                if (format === 'docx') {
                    result = await generator.generateWordDocument(fileName, contentWithMetadata, isDraft);
                } else if (format === 'html') {
                    result = generator.downloadHTML(fileName, contentWithMetadata, isDraft);
                } else if (format === 'pdf') {
                    result = generator.printToPDF(fileName, contentWithMetadata, isDraft);
                } else if (format === 'both') {
                    result = await generator.generateWordDocument(fileName, contentWithMetadata, isDraft);
                    generator.printToPDF(fileName, contentWithMetadata, isDraft);
                }

                // Update export history
                exportHistory = generator.getOutputHistory();
                renderExportHistory();

                hideLLMLoading();
                showToast(`${result.filename || fileName} 파일이 생성되었습니다`, 'success');
            } catch (error) {
                console.error('Export error:', error);
                hideLLMLoading();
                showToast('문서 생성 중 오류가 발생했습니다: ' + error.message, 'error');
            }
        }

        // Download export
        function downloadExport(id) {
            const item = exportHistory.find(e => e.id === id);
            showToast(`${item.name} 다운로드를 시작합니다`, 'info');
        }

        // Delete export
        function deleteExport(id) {
            if (!confirm('이 내보내기를 삭제하시겠습니까?')) return;

            const index = exportHistory.findIndex(e => e.id === id);
            if (index !== -1) {
                exportHistory.splice(index, 1);
                renderExportHistory();
                showToast('삭제되었습니다', 'success');
            }
        }

        // Initialize on load
        init();
    </script>
</body>

</html>
