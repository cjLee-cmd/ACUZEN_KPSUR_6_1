<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 점검 - KPSUR AGENT | ACUZEN AI</title>
    <link rel="stylesheet" href="../css/styles/globals.css">
    <style>
        :root {
            --bg-gradient-1: #07161D;
            --bg-gradient-2: #122E4E;
            --card-bg: rgba(255, 255, 255, 0.98);
            --card-shadow: rgba(0, 0, 0, 0.3);
            --text-primary: #07161D;
            --text-secondary: var(--app-text-normal);
            --text-label: var(--app-text-strong);
            --item-bg: var(--app-surface-muted);
            --item-border: var(--app-border-soft);
            --icon-bg: white;
            --progress-bg: var(--app-border-soft);
            --divider: var(--app-border-soft);
            --badge-bg: linear-gradient(135deg, var(--app-surface-muted) 0%, #F3F4F6 100%);
            --badge-border: var(--app-border-soft);
            --footer-text: var(--app-text-muted);
            --btn-skip-bg: #F3F4F6;
            --btn-skip-hover: var(--app-border-soft);
            --error-bg: #FEF2F2;
            --error-border: #FCA5A5;
            --error-title: #DC2626;
            --error-text: #991B1B;
        }

        [data-theme="dark"] {
            --bg-gradient-1: #121212;
            --bg-gradient-2: #1e1e1e;
            --card-bg: rgba(40, 40, 40, 0.98);
            --card-shadow: rgba(0, 0, 0, 0.5);
            --text-primary: #FFFFFF;
            --text-secondary: #D4D4D4;
            --text-label: #E5E5E5;
            --item-bg: #2a2a2a;
            --item-border: #404040;
            --icon-bg: #2a2a2a;
            --progress-bg: #2a2a2a;
            --divider: #404040;
            --badge-bg: linear-gradient(135deg, #2a2a2a 0%, #404040 100%);
            --badge-border: #404040;
            --footer-text: #A3A3A3;
            --btn-skip-bg: #2a2a2a;
            --btn-skip-hover: #404040;
            --error-bg: rgba(127, 29, 29, 0.3);
            --error-border: rgba(239, 68, 68, 0.4);
            --error-title: #f87171;
            --error-text: #fca5a5;
        }

        /* 다크모드 토글 버튼 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(31, 78, 140, 0.3);
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .theme-toggle {
            background: #2a2a2a;
            border-color: rgba(160, 160, 160, 0.3);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px var(--card-shadow);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            transition: all 0.3s ease;
        }

        .theme-toggle .sun-icon {
            color: #f59e0b;
            display: none;
        }

        .theme-toggle .moon-icon {
            color: #6366f1;
        }

        [data-theme="dark"] .theme-toggle .sun-icon {
            display: block;
        }

        [data-theme="dark"] .theme-toggle .moon-icon {
            display: none;
        }

        /* 전체 화면 중앙 정렬 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* 배경 애니메이션 */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(90, 141, 255, 0.3);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        /* 메인 컨테이너 */
        .check-container {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 48px 40px;
            width: 500px;
            box-shadow: 0 20px 60px var(--card-shadow);
            text-align: center;
        }

        /* 로고 */
        .logo {
            margin-bottom: 32px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #12305B;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 제목 */
        .check-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .check-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        /* 진행률 바 */
        .progress-container {
            margin-bottom: 40px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-label);
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #12305B 0%, #1F4E8C 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        /* 테스트 항목 */
        .test-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .test-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--item-bg);
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .test-item.active {
            border-color: #12305B;
            background: rgba(31, 78, 140, 0.05);
        }

        .test-item.success {
            border-color: #10B981;
            background: rgba(16, 185, 129, 0.05);
        }

        .test-item.error {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .test-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            background: var(--icon-bg);
            border: 2px solid var(--item-border);
        }

        .test-item.active .test-icon {
            border-color: #12305B;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .test-item.success .test-icon {
            border-color: #10B981;
            background: #10B981;
        }

        .test-item.error .test-icon {
            border-color: #EF4444;
            background: #EF4444;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(31, 78, 140, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 8px rgba(31, 78, 140, 0);
            }
        }

        .test-info {
            flex: 1;
            text-align: left;
        }

        .test-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 4px;
        }

        .test-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .test-item.active .test-status {
            color: #12305B;
        }

        .test-item.success .test-status {
            color: #10B981;
        }

        .test-item.error .test-status {
            color: #EF4444;
        }

        /* 스피너 */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--item-border);
            border-top-color: #12305B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 에러 메시지 */
        .error-details {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 8px;
            text-align: left;
        }

        .error-details.show {
            display: block;
        }

        .error-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--error-title);
            margin-bottom: 8px;
        }

        .error-message {
            font-size: 12px;
            color: var(--error-text);
            line-height: 1.5;
        }

        .error-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-retry {
            background: #12305B;
            color: white;
        }

        .btn-retry:hover {
            background: #1e5d7f;
        }

        .btn-skip {
            background: var(--btn-skip-bg);
            color: var(--text-label);
        }

        .btn-skip:hover {
            background: var(--btn-skip-hover);
        }

        /* 하단 안내 */
        .footer-note {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--divider);
            font-size: 11px;
            color: var(--footer-text);
        }

        /* 의료용 소프트웨어 뱃지 */
        .medical-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 6px;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .medical-icon {
            font-size: 12px;
        }
    </style>
</head>

<body>
    <script src="../js/mono-icons.js" data-icon-sprite="../assets/icons/mono-icons.svg"></script>
    <!-- 다크모드 토글 버튼 -->
    <button class="theme-toggle" id="themeToggle" aria-label="테마 변경">

    <!-- 배경 애니메이션 -->

    <!-- 메인 컨테이너 -->
    <div class="check-container">
        <!-- 로고 -->
        <div class="logo">
            <div class="logo-text">KPSUR AGENT</div>

        <!-- 제목 -->

            <!-- 파일 저장소 연결 테스트 -->

        <!-- 에러 메시지 -->

                <button class="btn btn-retry" onclick="retryTests()">다시 시도</button>

            <div class="medical-badge">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Security & Navigation -->
    <script src="../utils/session.js"></script>
    <script src="../utils/navigation.js"></script>

    <script>
        // === 다크모드 토글 기능 ===
        const themeToggle = document.getElementById('themeToggle');

        function getPreferredTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                return savedTheme;
            }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        applyTheme(getPreferredTheme());

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        // === 설정 ===
        const SUPABASE_URL = 'https://toelnxgizxwbdikskmxa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvZWxueGdpenh3YmRpa3NrbXhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwMDAyMzUsImV4cCI6MjA3NzU3NjIzNX0.mpBAWTufodmfPUp6nmg7Qez6uygrplK9S91xl8c4mR8';

        // Supabase 클라이언트 초기화
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // === OAuth 콜백 처리 ===
        // URL에 OAuth 파라미터가 있는지 확인 (Google 로그인 후 리다이렉트)
        (async function handleOAuthCallback() {
            const hash = window.location.hash;
            const params = new URLSearchParams(window.location.search);

            // OAuth 리다이렉트 감지 (access_token이 hash 또는 query에 있는 경우)
            if (hash.includes('access_token') || params.has('code')) {
                console.log('🔄 OAuth callback detected, processing...');

                try {
                    // Supabase가 자동으로 세션을 처리함
                    const { data, error } = await supabaseClient.auth.getSession();

                    if (error) throw error;

                    if (data.session) {
                        const user = data.session.user;
                        console.log('✅ OAuth login successful:', user.email);

                        // 세션 데이터 생성 (기존 형식에 맞춤)
                        const sessionData = {
                            userId: user.id,
                            email: user.email,
                            userName: user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0],
                            userRole: user.user_metadata?.role || 'Author',
                            userPosition: user.user_metadata?.position || '',
                            loginTime: new Date().toISOString(),
                            rememberMe: true,
                            type: 'google',
                            timestamp: Date.now(),
                            avatarUrl: user.user_metadata?.avatar_url || null
                        };

                        // localStorage에 세션 저장
                        localStorage.setItem('kpsur_session', JSON.stringify(sessionData));

                        // URL에서 OAuth 파라미터 제거 (깔끔한 URL)
                        history.replaceState(null, '', window.location.pathname);
                    }
                } catch (error) {
                    console.error('❌ OAuth callback error:', error);
                }
            }
        })();

        // === 상태 관리 ===
        let currentTest = 0;
        const totalTests = 3;
        const testResults = {
            llm: null,
            db: null,
            storage: null
        };

        // === 배경 파티클 생성 ===
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // === 진행률 업데이트 ===
        function updateProgress(current, total, text) {
            const percent = Math.round((current / total) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // === 테스트 항목 상태 업데이트 ===
        function updateTestStatus(testId, status, message) {
            const testItem = document.getElementById(testId);
            const statusEl = testItem.querySelector('.test-status');
            const spinner = testItem.querySelector('.spinner');
            const icon = testItem.querySelector('.test-icon');

            // 클래스 초기화
            testItem.classList.remove('active', 'success', 'error');

            if (status === 'testing') {
                testItem.classList.add('active');
                spinner.style.display = 'block';
                statusEl.textContent = message || '테스트 중...';
            } else if (status === 'success') {
                testItem.classList.add('success');
                spinner.style.display = 'none';
                icon.innerHTML = '<svg class="mono-icon icon-check" aria-hidden="true" focusable="false" style="width:16px;height:16px;"><use href="#icon-check"></use></svg>';
                statusEl.textContent = message || '연결 성공';
            } else if (status === 'error') {
                testItem.classList.add('error');
                spinner.style.display = 'none';
                icon.innerHTML = '<svg class="mono-icon icon-x" aria-hidden="true" focusable="false" style="width:16px;height:16px;"><use href="#icon-x"></use></svg>';
                statusEl.textContent = message || '연결 실패';
            }
        }

        // === LLM 연결 테스트 ===
        async function testLLMConnection() {
            updateTestStatus('testLLM', 'testing', 'AI 엔진 연결 중...');
            updateProgress(1, totalTests, 'AI 엔진 연결 테스트');

            try {
                // localStorage에서 API 키 가져오기
                const apiKeyRaw = localStorage.getItem('GOOGLE_API_KEY');

                if (!apiKeyRaw) {
                    throw new Error('Gemini API 키가 설정되지 않았습니다. 시스템 설정에서 API 키를 등록해주세요.');
                }

                // API 키 파싱 (JSON 형식과 일반 문자열 모두 지원)
                let apiKey;
                try {
                    // JSON 형식으로 저장된 경우 (예: "\"AIzaSyBc...\"")
                    apiKey = JSON.parse(apiKeyRaw);
                } catch {
                    // 일반 문자열로 저장된 경우 (예: "AIzaSyBc...")
                    apiKey = apiKeyRaw;
                }

                // 간단한 연결 테스트 - gemini-3-flash-preview 사용 (기본 모델)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: 'Hello' }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: API 응답 실패`);
                }

                const data = await response.json();
                if (!data.candidates || data.candidates.length === 0) {
                    throw new Error('응답 데이터가 올바르지 않습니다');
                }

                testResults.llm = true;
                updateTestStatus('testLLM', 'success', '연결 성공');
                currentTest++;
                return true;

            } catch (error) {
                testResults.llm = false;
                updateTestStatus('testLLM', 'error', error.message);
                throw error;
            }
        }

        // === 데이터베이스 연결 테스트 ===
        async function testDatabaseConnection() {
            updateTestStatus('testDB', 'testing', '데이터베이스 연결 중...');
            updateProgress(2, totalTests, '데이터베이스 연결 테스트');

            try {
                // 세션 확인
                const session = JSON.parse(localStorage.getItem('kpsur_session') || '{}');
                if (!session.userId) {
                    throw new Error('사용자 세션이 유효하지 않습니다');
                }

                // 간단한 쿼리 테스트
                const { data, error } = await supabaseClient
                    .from('system_settings')
                    .select('count')
                    .limit(1);

                if (error) {
                    throw new Error(error.message);
                }

                testResults.db = true;
                updateTestStatus('testDB', 'success', '연결 성공');
                currentTest++;
                return true;

            } catch (error) {
                testResults.db = false;
                updateTestStatus('testDB', 'error', error.message);
                throw error;
            }
        }

        // === 파일 저장소 연결 테스트 ===
        async function testStorageConnection() {
            updateTestStatus('testStorage', 'testing', '저장소 연결 중...');
            updateProgress(3, totalTests, '파일 저장소 연결 테스트');

            try {
                // Storage 버킷 목록 조회
                const { data, error } = await supabaseClient.storage.listBuckets();

                if (error) {
                    throw new Error(error.message);
                }

                testResults.storage = true;
                updateTestStatus('testStorage', 'success', '연결 성공');
                currentTest++;
                return true;

            } catch (error) {
                testResults.storage = false;
                updateTestStatus('testStorage', 'error', error.message);
                throw error;
            }
        }

        // === 전체 테스트 실행 ===
        async function runAllTests() {
            try {
                // 각 테스트를 순차적으로 실행
                await testLLMConnection();
                await new Promise(resolve => setTimeout(resolve, 500)); // 0.5초 대기

                await testDatabaseConnection();
                await new Promise(resolve => setTimeout(resolve, 500));

                await testStorageConnection();
                await new Promise(resolve => setTimeout(resolve, 500));

                // 모든 테스트 성공
                updateProgress(totalTests, totalTests, '모든 점검 완료!');

                // 네비게이션 플래그 설정 (리프레시 보안용)
                if (typeof setNavigationFlag === 'function') {
                    setNavigationFlag();
                }

                // 1초 후 대시보드로 이동
                setTimeout(() => {
                    window.location.href = 'P10_Dashboard.html';
                }, 1000);

            } catch (error) {
                // 에러 발생 시 에러 메시지 표시
                showError(error.message);
            }
        }

        // === 에러 표시 ===
        function showError(message) {
            const errorDetails = document.getElementById('errorDetails');
            const errorMessage = document.getElementById('errorMessage');

            // Check if it's an API key error and enhance with link to Settings
            if (message.includes('Gemini API 키가 설정되지 않았습니다')) {
                errorMessage.innerHTML = `
                    Gemini API 키가 설정되지 않았습니다.<br><br>
                    <a href="#" onclick="navigateTo('P91_Settings.html'); return false;" style="color: #12305B; font-weight: 600; text-decoration: underline; cursor: pointer;">
                        시스템 설정에서 API 키 등록하기 →
                    </a>
                `;
            } else {
                errorMessage.textContent = message;
            }

            errorDetails.classList.add('show');
            updateProgress(currentTest, totalTests, '점검 실패');
        }

        // === 재시도 ===
        function retryTests() {
            // 에러 메시지 숨기기
            document.getElementById('errorDetails').classList.remove('show');

            // 상태 초기화
            currentTest = 0;
            testResults.llm = null;
            testResults.db = null;
            testResults.storage = null;

            // 테스트 항목 초기화
            ['testLLM', 'testDB', 'testStorage'].forEach(id => {
                const testItem = document.getElementById(id);
                testItem.classList.remove('active', 'success', 'error');
                testItem.querySelector('.test-status').textContent = '대기 중';
                testItem.querySelector('.spinner').style.display = 'none';

                // 아이콘 초기화
                const icons = ['[AI]', '[DB]', '[FS]'];
                const index = ['testLLM', 'testDB', 'testStorage'].indexOf(id);
                testItem.querySelector('.test-icon').textContent = icons[index];
            });

            // 진행률 초기화
            updateProgress(0, totalTests, '준비 중...');

            // 재실행
            setTimeout(runAllTests, 500);
        }

        // === 건너뛰기 ===
        function skipToMain() {
            if (confirm('시스템 점검을 건너뛰면 일부 기능이 제대로 작동하지 않을 수 있습니다.\n그래도 계속하시겠습니까?')) {
                // 네비게이션 플래그 설정 (리프레시 보안용)
                if (typeof setNavigationFlag === 'function') {
                    setNavigationFlag();
                }
                window.location.href = 'P10_Dashboard.html';
            }
        }

        // === 페이지 로드 시 실행 ===
        window.addEventListener('DOMContentLoaded', () => {
            // 배경 파티클 생성
            createParticles();

            // 세션 확인
            const session = JSON.parse(localStorage.getItem('kpsur_session') || '{}');
            // auth.js의 sessionData 구조: { userId, email, userName, ... }
            if (!session.userId) {
                // 세션이 없으면 로그인 페이지로 리다이렉트
                // (일시적으로 주석 처리하여 디버깅 가능하게 함, 실제로는 활성화 필요)
                console.warn('⚠️ No session found in P05, redirecting to login...');
                window.location.href = 'P01_Login.html';
                return;
            }

            // 1초 후 테스트 시작
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
