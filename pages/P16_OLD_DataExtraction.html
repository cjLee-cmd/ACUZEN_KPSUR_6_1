<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-16 Data Extraction - KPSUR AGENT</title>
    <link rel="stylesheet" href="../css/styles/globals.css">
    <link rel="stylesheet" href="../css/styles/layout.css">
    <link rel="stylesheet" href="../css/styles/components.css">
    <style>
        /* Override parent container constraints for full-width layout */
        .app-content {
            max-width: 100% !important;
            width: 100% !important;
        }

        .main-content {
            max-width: 100% !important;
            width: 100% !important;
            padding: 0 !important;
        }

        .extraction-container {
            display: grid;
            grid-template-columns: minmax(250px, 300px) 1fr;
            gap: 16px;
            padding: 16px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Left Panel - File List */
        .file-list-panel {
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            overflow-y: auto;
        }

        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .file-list-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #07161D;
            margin: 0;
        }

        .file-stats {
            font-size: 11px;
            color: #64748b;
        }

        .file-category {
            margin-bottom: 16px;
        }

        .file-category-title {
            font-size: 12px;
            font-weight: 600;
            color: #12305B;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #e2e8f0;
        }

        .file-item {
            padding: 8px;
            margin-bottom: 4px;
            background: #f8fafc;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .file-item:hover {
            background: #f1f5f9;
        }

        .file-item.active {
            background: #EBF5FF;
            border-left: 3px solid #12305B;
        }

        .file-item.selected {
            background: #EBF5FF;
        }

        .file-name {
            font-weight: 500;
            color: #07161D;
            margin-bottom: 4px;
        }

        .file-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #64748b;
        }

        .file-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 500;
        }

        .file-status.pending { background: #FEF3C7; color: #92400E; }
        .file-status.extracting { background: #DBEAFE; color: #1E40AF; }
        .file-status.completed { background: #D1FAE5; color: #065F46; }
        .file-status.conflict { background: #FEE2E2; color: #991B1B; }
        .file-status.error { background: #FEE2E2; color: #991B1B; }

        /* Main Panel - Data Extraction */
        .data-panel {
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .data-panel-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .data-panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #07161D;
            margin: 0 0 8px 0;
        }

        .extraction-warning {
            background: #FEF3C7;
            border-left: 4px solid #F59E0B;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .extraction-warning-title {
            font-weight: 600;
            color: #92400E;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .extraction-warning-text {
            font-size: 11px;
            color: #92400E;
            line-height: 1.4;
        }

        .extraction-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .llm-model-select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 12px;
            color: #07161D;
            background: white;
        }

        .data-tabs {
            display: flex;
            gap: 4px;
            padding: 0 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-tab {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .data-tab:hover {
            color: #12305B;
        }

        .data-tab.active {
            color: #12305B;
            border-bottom-color: #12305B;
        }

        .data-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .data-section {
            display: none;
        }

        .data-section.active {
            display: block;
        }

        /* CS Data Grid */
        .cs-data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .cs-data-item {
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .cs-data-item.has-conflict {
            border-color: #F59E0B;
            background: #FFFBEB;
        }

        .cs-data-item.has-value {
            border-color: #10B981;
        }

        .cs-data-label {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cs-data-value {
            font-size: 13px;
            color: #07161D;
            min-height: 20px;
            padding: 6px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .cs-data-value.empty {
            color: #94a3b8;
            font-style: italic;
        }

        .cs-data-value.editable {
            cursor: pointer;
        }

        .cs-data-value.editable:hover {
            border-color: #12305B;
        }

        /* CS17 테이블 스타일 */
        .cs-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 4px;
        }

        .cs-data-table th,
        .cs-data-table td {
            border: 1px solid #e2e8f0;
            padding: 4px 6px;
            text-align: left;
        }

        .cs-data-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #273453;
        }

        .cs-data-table td {
            background: white;
        }

        .cs-data-table tr:hover td {
            background: #f1f5f9;
        }

        .conflict-indicator {
            background: #F59E0B;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        .missing-indicator {
            background: #EF4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* PH Data */
        .ph-data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ph-data-item {
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .ph-data-item.has-value {
            border-color: #10B981;
        }

        .ph-data-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .ph-data-value {
            font-size: 13px;
            color: #07161D;
            line-height: 1.6;
            min-height: 60px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
        }

        /* Table Data */
        .table-data-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .table-data-item {
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .table-data-item.has-value {
            border-color: #10B981;
        }

        .table-data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .table-data-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        .table-preview {
            overflow-x: auto;
        }

        .table-preview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .table-preview th {
            background: #12305B;
            color: white;
            padding: 6px 8px;
            text-align: left;
            font-weight: 500;
        }

        .table-preview td {
            padding: 6px 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-preview tr:hover {
            background: #f1f5f9;
        }

        /* Extraction Progress */
        .extraction-progress {
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .progress-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 8px;
        }

        .progress-stat {
            font-size: 12px;
        }

        .progress-stat-label {
            color: #64748b;
            font-size: 11px;
        }

        .progress-stat-value {
            font-weight: 600;
            color: #07161D;
            font-size: 14px;
        }

        .progress-bar-container {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #12305B, #1F4E8C);
            transition: width 0.3s ease;
        }

        /* Conflict Resolution Modal */
        .conflict-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .conflict-modal.show {
            display: flex;
        }

        .conflict-modal-content {
            background: white;
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .conflict-modal-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            background: #FEF3C7;
        }

        .conflict-modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #92400E;
            margin: 0;
        }

        .conflict-modal-body {
            padding: 20px;
        }

        .conflict-description {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 16px;
        }

        .conflict-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .conflict-option {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .conflict-option:hover {
            border-color: #12305B;
            background: #EBF5FF;
        }

        .conflict-option.selected {
            border-color: #12305B;
            background: #EBF5FF;
        }

        .conflict-option-source {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .conflict-option-value {
            font-size: 13px;
            color: #07161D;
            font-weight: 500;
        }

        .conflict-modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .extraction-container {
                grid-template-columns: minmax(220px, 280px) 1fr;
            }
        }

        @media (max-width: 900px) {
            .extraction-container {
                grid-template-columns: 1fr;
            }

            .file-list-panel {
                max-height: 300px;
            }

            .cs-data-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .extraction-container {
                padding: 8px;
                gap: 8px;
            }

            .data-panel-header {
                padding: 12px;
            }

            .data-content {
                padding: 12px;
            }

            .progress-stats {
                flex-wrap: wrap;
            }

            .data-tabs {
                padding: 0 8px;
                overflow-x: auto;
            }

            .data-tab {
                padding: 8px 12px;
                font-size: 12px;
                white-space: nowrap;
            }
        }

        /* Markdown Preview Popup */
        .markdown-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .markdown-popup-overlay.active {
            display: flex;
        }

        .markdown-popup-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .markdown-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 12px 12px 0 0;
        }

        .markdown-popup-title {
            font-size: 14px;
            font-weight: 600;
            color: #07161D;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .markdown-popup-title .raw-id-badge {
            background: #12305B;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .markdown-popup-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .markdown-popup-close:hover {
            background: #e2e8f0;
            color: #07161D;
        }

        .markdown-popup-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #0B1730;
            white-space: pre-wrap;
            word-break: break-word;
            background: #fafafa;
        }

        .markdown-popup-body::-webkit-scrollbar {
            width: 8px;
        }

        .markdown-popup-body::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .markdown-popup-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .markdown-popup-body::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .markdown-empty {
            color: #94a3b8;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
        }

        /* 다크모드 변수 */
        :root {
            --page-bg: #F2F5FC;
            --card-bg: white;
            --text-primary: #07161D;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --section-bg: #f8fafc;
            --input-bg: white;
        }

        [data-theme="dark"] {
            --page-bg: #0B1730;
            --card-bg: #0B1730;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #1C2740;
            --section-bg: #1C2740;
            --input-bg: #1C2740;
        }

        /* 다크모드 패널 스타일 */
        [data-theme="dark"] .file-list-panel,
        [data-theme="dark"] .data-panel {
            background: transparent !important;
            border-color: #273453;
        }

        [data-theme="dark"] .file-list-header h3,
        [data-theme="dark"] .data-panel-title {
            color: var(--text-primary);
        }

        [data-theme="dark"] .file-stats {
            color: #94a3b8;
        }

        [data-theme="dark"] .file-category-title {
            color: #60a5fa;
            border-color: #273453;
        }

        [data-theme="dark"] .file-item {
            background: #1C2740;
        }

        [data-theme="dark"] .file-item:hover {
            background: #3f4f63;
        }

        [data-theme="dark"] .file-item.active,
        [data-theme="dark"] .file-item.selected {
            background: rgba(59, 130, 246, 0.2);
            border-left-color: #60a5fa;
        }

        [data-theme="dark"] .file-name {
            color: var(--text-primary);
        }

        [data-theme="dark"] .file-meta {
            color: #94a3b8;
        }

        [data-theme="dark"] .file-status.pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        [data-theme="dark"] .file-status.extracting {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        [data-theme="dark"] .file-status.completed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        [data-theme="dark"] .file-status.conflict,
        [data-theme="dark"] .file-status.error {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        [data-theme="dark"] .data-panel-header {
            background: #1C2740;
            border-color: #273453;
        }

        [data-theme="dark"] .extraction-warning {
            background: rgba(251, 191, 36, 0.15);
            border-left-color: #fbbf24;
        }

        [data-theme="dark"] .extraction-warning-title,
        [data-theme="dark"] .extraction-warning-text {
            color: #fbbf24;
        }

        [data-theme="dark"] .llm-model-select {
            background: #1C2740;
            border-color: #273453;
            color: var(--text-primary);
        }

        [data-theme="dark"] .data-tabs {
            background: #1C2740;
            border-color: #273453;
        }

        [data-theme="dark"] .data-tab {
            color: #94a3b8;
        }

        [data-theme="dark"] .data-tab.active {
            color: #60a5fa;
            border-bottom-color: #60a5fa;
        }

        [data-theme="dark"] .data-tab:hover {
            color: #60a5fa;
        }

        [data-theme="dark"] .data-content {
            background: #0B1730;
        }

        [data-theme="dark"] .extraction-item {
            background: #1C2740;
            border-color: #273453;
        }

        [data-theme="dark"] .extraction-label {
            color: var(--text-secondary);
        }

        [data-theme="dark"] .extraction-value {
            background: #0B1730;
            border-color: #273453;
            color: var(--text-primary);
        }

        [data-theme="dark"] .extraction-status.extracted {
            color: #34d399;
        }

        [data-theme="dark"] .extraction-status.pending {
            color: #94a3b8;
        }

        [data-theme="dark"] .extraction-status.conflict {
            color: #fbbf24;
        }

        [data-theme="dark"] .markdown-preview {
            background: #1C2740;
            border-color: #273453;
        }

        [data-theme="dark"] .markdown-content {
            color: var(--text-primary);
        }

        [data-theme="dark"] .conflict-modal-content {
            background: #0B1730;
            border: 1px solid #273453;
        }

        [data-theme="dark"] .conflict-modal-header {
            background: #1C2740;
            border-color: #273453;
        }

        [data-theme="dark"] .conflict-modal-title {
            color: var(--text-primary);
        }

        [data-theme="dark"] .conflict-description {
            color: var(--text-secondary);
        }

        [data-theme="dark"] .conflict-option {
            background: #1C2740;
            border-color: #273453;
        }

        [data-theme="dark"] .conflict-option:hover {
            border-color: #60a5fa;
        }

        [data-theme="dark"] .conflict-option.selected {
            border-color: #60a5fa;
            background: rgba(59, 130, 246, 0.1);
        }

        [data-theme="dark"] .conflict-source {
            color: var(--text-secondary);
        }

        [data-theme="dark"] .conflict-value {
            color: var(--text-primary);
        }

        /* Header styles */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            font-size: 18px;
            font-weight: 700;
            color: #12305B;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dark-mode-toggle {
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .dark-mode-toggle:hover {
            border-color: #12305B;
        }

        [data-theme="dark"] .dark-mode-toggle {
            background: #1C2740;
            border-color: #273453;
        }

        .icon-sun, .icon-moon {
            font-size: 16px;
        }

        [data-theme="light"] .icon-moon {
            display: none;

            // 데이터 정의 파일 로드 (Ref/*.md 파일)
            async loadDataDefinitions() {
                if (this.definitionsLoaded) {
                    return true;
                }

                console.log('📚 Loading data definitions from Ref/*.md files...');

                const definitionFiles = [
                    { type: 'CS', path: '../Ref/01_CSData_Definition.md' },
                    { type: 'PH', path: '../Ref/02_PHData_Definition.md' },
                    { type: 'Table', path: '../Ref/03_TableData_Definition.md' }
                ];

                for (const file of definitionFiles) {
                    try {
                        const response = await fetch(file.path);
                        if (response.ok) {
                            const markdown = await response.text();
                            this.parseDefinitionMarkdown(markdown, file.type);
                            console.log(`✅ Loaded ${file.type} definitions`);

                    } catch (error) {

                this.definitionsLoaded = true;
                console.log('📚 Data definitions loaded:', {
                    CS: Object.keys(this.dataDefinitions.CS).length,

                });

                return true;

            // 마크다운 정의 파일 파싱
            parseDefinitionMarkdown(markdown, type) {
                // ### N. [변수ID_변수명] 패턴 매칭
                const sectionRegex = /### \d+\. \[([^\]]+)\]([\s\S]*?)(?=### \d+\. \[|---\s*$|$)/g;
                let match;

                while ((match = sectionRegex.exec(markdown)) !== null) {
                    const fullId = match[1];  // 예: CS0_성분명, PH4_원시자료서술문, 표2_연도별판매량
                    const content = match[2];

                    // Variable ID 추출
                    const idMatch = fullId.match(/^(CS\d+(?:\.\d+)?|PH\d+|표\d+)/);
                    if (!idMatch) continue;

                    let variableId = idMatch[1];
                    // 표X -> TX 변환
                    if (variableId.startsWith('표')) {
                        variableId = 'T' + variableId.substring(1);
                    }

                    // Variable Name 추출
                    const nameMatch = content.match(/\*\*Variable Name:\*\*\s*(.+)/);
                    const name = nameMatch ? nameMatch[1].trim() : fullId.split('_').slice(1).join('_');

                    // Data Source 추출
                    const sourceMatch = content.match(/\*\*Data Source:\*\*\s*(.+)/);
                    const source = sourceMatch ? sourceMatch[1].trim() : '';

                    // 데이터 추출 방법 추출
                    const methodMatch = content.match(/#### 데이터 추출 방법[\s\S]*?> \*\*\[지침\]\*\*\s*([\s\S]*?)(?=####|$)/);
                    let method = '';
                    if (methodMatch) {
                        method = methodMatch[1].trim()
                            .replace(/> \*\*\[지침\]\*\*/g, '\n')
                            .replace(/\n+/g, ' ')
                            .trim();
                    }

                    // 추가 지침 추출
                    const additionalMatch = content.match(/#### 추가 지침[\s\S]*?> \*\*\[지침\]\*\*\s*([\s\S]*?)(?=####|$)/);
                    if (additionalMatch && !method) {
                        method = additionalMatch[1].trim()
                            .replace(/> \*\*\[지침\]\*\*/g, '\n')
                            .replace(/\n+/g, ' ')
                            .trim();
                    }

                    // 예시 추출
                    const exampleMatch = content.match(/#### 예시[\s\S]*?1\.\s*`([^`]+)`/);
                    const example = exampleMatch ? exampleMatch[1] : '';

                    // 정의 저장
                    this.dataDefinitions[type][variableId] = {
                        name: name,
                        source: source,
                        method: method.substring(0, 500),  // 너무 긴 경우 자르기
                        example: example.substring(0, 300)
                    };
                }
            },

            // 로드된 정의에서 필드 정보 가져오기
            getFieldDefinition(fieldId) {
                // CS, PH, Table 순서로 검색
                if (fieldId.startsWith('CS')) {
                    return this.dataDefinitions.CS[fieldId];
                } else if (fieldId.startsWith('PH')) {
                    return this.dataDefinitions.PH[fieldId];
                } else if (fieldId.startsWith('T')) {
                    return this.dataDefinitions.Table[fieldId];
                }
                return null;
            },

            async extractFromMarkdown(markdownContent, rawId, dataDefinitions) {
                // 먼저 데이터 정의 로드
                await this.loadDataDefinitions();
                console.log(`📊 Extracting data from RAW ID: ${rawId}`);

                const apiKey = Storage.get(CONFIG.STORAGE_KEYS.GOOGLE_API_KEY);
                if (!apiKey) {
                    console.error('❌ API key not found');
                    return { success: false, error: 'API key not found' };
                }

                const model = document.getElementById('llmModel').value || CONFIG.LLM.DEFAULT_MODEL;
                const modelName = model === 'pro' ? 'gemini-2.5-pro-preview-06-05' : 'gemini-2.5-flash';
                const url = `${CONFIG.LLM.API_ENDPOINT}/${modelName}:generateContent?key=${apiKey}`;

                // RAW ID별 추출 대상 정의
                const extractionTargets = this.getExtractionTargets(rawId);
                if (!extractionTargets || extractionTargets.length === 0) {
                    console.log(`⏭️ No extraction targets for RAW ID: ${rawId}`);
                    return { success: true, csData: {}, phData: {}, tableData: {}, extractedAt: DateHelper.formatISO() };
                }

                const prompt = this.buildExtractionPrompt(markdownContent, rawId, extractionTargets);

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { temperature: 0.1, maxOutputTokens: 8192 }
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    console.log(`✅ LLM response for ${rawId}:`, text.substring(0, 200));

                    const extracted = this.parseExtractionResponse(text, rawId);

                        success: true,
                        csData: extracted.csData || {},
                        phData: extracted.phData || {},
                        tableData: extracted.tableData || {},
                        extractedAt: DateHelper.formatISO()
                    };

            getExtractionTargets(rawId) {

                    'RAW4': ['CS17.1', 'CS17.2', 'CS17.3', 'CS17.4', 'CS17.5', 'CS17.6'],  // 허가현황 (CS17.1~CS17.6만 추출, 테이블 제외)

                    'RAW7.1': ['CS56', 'CS56.1'],  // 안전성정보변경_복수항목

                return targetMap[rawId] || [];
            },

            buildExtractionPrompt(content, rawId, targets) {

                const targetDetails = targets.map(t => {

                        let detail = `### ${t}: ${def.name || t}`;
                        if (def.source) detail += `\n- **데이터 소스**: ${def.source}`;
                        if (def.method) detail += `\n- **추출 방법**: ${def.method}`;
                        if (def.example) detail += `\n- **예시 출력**: ${def.example}`;

            parseExtractionResponse(text, rawId) {
                const result = { csData: {}, phData: {}, tableData: {} };

                try {
                    // 1. 완전한 마크다운 코드 블록에서 JSON 추출 시도
                    let jsonStr = null;
                    const codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
                    if (codeBlockMatch) {
                        jsonStr = codeBlockMatch[1].trim();
                    }

                    // 2. 코드 블록이 없으면 truncated 코드 블록 시도 (닫는 ``` 없음)
                    if (!jsonStr) {
                        const truncatedMatch = text.match(/```(?:json)?\s*([\s\S]*)/);
                        if (truncatedMatch) {
                            jsonStr = truncatedMatch[1].trim();
                        }
                    }

                    // 3. 코드 블록이 없으면 일반 JSON 블록 추출
                    if (!jsonStr) {
                        const jsonMatch = text.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            jsonStr = jsonMatch[0];
                        }
                    }

                    if (!jsonStr) {
                        console.warn('⚠️ No JSON found in response for', rawId);
                        return result;
                    }

                    // JSON 파싱 시도, 실패 시 부분 파싱
                    let parsed;
                    try {
                        parsed = JSON.parse(jsonStr);
                    } catch (parseError) {
                        // Truncated JSON 복구 시도: 불완전한 JSON 수정
                        console.warn(`⚠️ Attempting to repair truncated JSON for ${rawId}`);
                        let repairedJson = jsonStr;

                        // 1. 불완전한 키-값 쌍 제거 (예: "key": nul, "key": tru, "key": "incomplete)
                        repairedJson = repairedJson.replace(/,?\s*"[^"]*"\s*:\s*(?:nul|tru|fal|"[^"]*)?$/g, '');

                        // 2. 마지막으로 완전한 값 찾기 (쉼표로 끝나는 키-값 쌍)
                        const lastCommaPatterns = ['"},', 'null,', 'true,', 'false,', '},', '],'];
                        let lastValidPos = -1;
                        lastCommaPatterns.forEach(pattern => {
                            const pos = repairedJson.lastIndexOf(pattern);
                            if (pos > lastValidPos) {
                                lastValidPos = pos + pattern.length - 1; // 쉼표 위치
                            }
                        });

                        // 3. 완전한 값 위치까지 자르기 (쉼표 제거)
                        if (lastValidPos > 0) {
                            repairedJson = repairedJson.substring(0, lastValidPos);
                        }

                        // 4. 열린 괄호 수 계산 및 닫기
                        const openBraces = (repairedJson.match(/\{/g) || []).length;
                        const closeBraces = (repairedJson.match(/\}/g) || []).length;
                        const openBrackets = (repairedJson.match(/\[/g) || []).length;
                        const closeBrackets = (repairedJson.match(/\]/g) || []).length;

                        for (let i = 0; i < openBrackets - closeBrackets; i++) {
                            repairedJson += ']';
                        }
                        for (let i = 0; i < openBraces - closeBraces; i++) {
                            repairedJson += '}';
                        }

                        try {
                            parsed = JSON.parse(repairedJson);
                            console.log(`✅ Repaired JSON for ${rawId}:`, Object.keys(parsed));
                        } catch (e2) {
                            throw parseError; // 원래 에러 던지기
                        }
                    }

                    Object.keys(parsed).forEach(key => {
                        const value = parsed[key];
                        if (value && value !== 'null' && value !== null) {
                            if (key.startsWith('CS')) {

                            } else if (key.startsWith('PH')) {
                                result.phData[key] = { value: value, source: rawId };
                            } else if (key.startsWith('T') && /^T\d+/.test(key)) {
                                // Table 데이터 (T1-T9)
                                result.tableData[key] = { value: value, source: rawId };
                            }
                        }
                    });

                                <button class="btn btn-primary magic-effect" onclick="startExtraction()">
                                    ✨ AI 데이터 추출 시작
                                </button>
                                <button class="btn btn-secondary" onclick="exportData()">
                                    💾 데이터 저장
                                </button>
                                <button class="btn btn-primary" onclick="generatePSURReport()" id="generatePsurBtn" style="background: linear-gradient(135deg, #059669 0%, #10B981 100%);">
                                    📄 PSUR 보고서 생성
                                </button>
                                <button class="btn btn-success" onclick="proceedToNext()">
                                    다음 단계 →
                                </button>
                            </div>
                        </div>

                        <div class="data-tabs">
                            <button class="data-tab active" onclick="switchTab('cs')">CS 데이터 (52)</button>
                            <button class="data-tab" onclick="switchTab('ph')">PH 데이터 (9)</button>
                            <button class="data-tab" onclick="switchTab('table')">표 데이터 (9)</button>
                        </div>

                        <div class="data-content">
                            <!-- CS Data Section -->
                            <div id="csSection" class="data-section active">
                                <div class="cs-data-grid" id="csDataGrid"></div>
                            </div>

                            <!-- PH Data Section -->
                            <div id="phSection" class="data-section">
                                <div class="ph-data-list" id="phDataList"></div>
                            </div>

                            <!-- Table Data Section -->
                            <div id="tableSection" class="data-section">
                                <div class="table-data-list" id="tableDataList"></div>
                            </div>
                        </div>
                    </div>
                </div>
                </main>
                </div>

                <!-- Footer -->
                <footer class="app-footer">
                    <div class="footer-content">
                        Copyright. Power Solution., Inc. 2026.
                    </div>
                </footer>
            `;

            const appElement = document.getElementById('app');
            const header = appElement.querySelector('.app-header');
            if (header) {
                header.insertAdjacentHTML('afterend', layout.render(content));
            } else {
                appElement.innerHTML = layout.render(content);
            }

            // 사용자 입력 데이터 로드 (P13에서 저장한 데이터)
            loadUserInputData();

            renderFileList();
            renderCSData();
            renderPHData();
            renderTableData();
            updateStats();
        }

        // 사용자 입력 데이터 로드 (P13_NewReport에서 저장한 데이터)
        function loadUserInputData() {
            try {
                const savedData = localStorage.getItem('current_report');
                if (!savedData) {
                    console.log('ℹ️ 저장된 사용자 입력 데이터 없음');
                    return;
                }

                const userInput = JSON.parse(savedData);
                console.log('📥 사용자 입력 데이터 로드:', userInput);

                // CS 데이터에 사용자 입력 값 채우기 (01_CSData_Definition.md 기준)
                const userInputFields = ['CS0', 'CS1', 'CS2', 'CS4', 'CS5', 'CS6', 'CS7', 'CS13', 'CS24', 'CS31', 'CS53'];

                userInputFields.forEach(fieldId => {
                    if (userInput[fieldId]) {
                        const csItem = csData.find(item => item.id === fieldId);
                        if (csItem) {
                            csItem.value = userInput[fieldId];
                            csItem.source = 'user_input';
                            console.log(`  ✅ ${fieldId}: ${userInput[fieldId]}`);
                        }
                    }
                });

                // 추가 메타 정보 저장 (나중에 필요할 수 있음)
                window.currentReportMeta = {
                    reportId: userInput.reportId,
                    createdAt: userInput.createdAt,
                    authorName: userInput.authorName,
                    authorPosition: userInput.authorPosition,
                    description: userInput.description
                };

                console.log('✅ 사용자 입력 데이터 로드 완료');

            } catch (e) {
                console.error('❌ 사용자 입력 데이터 로드 실패:', e);
            }
        }

        // Render file list
        function renderFileList() {
            const requiredFiles = markdownFiles.filter(f => f.category === 'required');
            const lineListingFiles = markdownFiles.filter(f => f.category === 'lineListing');

            document.getElementById('requiredFiles').innerHTML = requiredFiles.map(file => `
                <div class="file-item ${selectedFile?.id === file.id ? 'selected' : ''}" onclick="showMarkdownPopup(${file.id})">
                    <div class="file-name">${file.name}</div>
                    <div class="file-meta">
                        <span>${file.rawId}</span>
                        <span class="file-status ${file.status}">${getStatusLabel(file.status)}</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('lineListingFiles').innerHTML = lineListingFiles.map(file => `
                <div class="file-item ${selectedFile?.id === file.id ? 'selected' : ''}" onclick="showMarkdownPopup(${file.id})">
                    <div class="file-name">${file.name}</div>
                    <div class="file-meta">
                        <span>${file.rawId}</span>
                        <span class="file-status ${file.status}">${getStatusLabel(file.status)}</span>
                    </div>
                </div>
            `).join('');
        }

        function getStatusLabel(status) {
            const labels = {
                'pending': '대기',
                'extracting': '추출 중',
                'completed': '완료',
                'conflict': '충돌',
                'error': '오류'
            };
            return labels[status] || status;
        }

        // 데이터 값 포맷팅 (배열, 객체 처리)
        function formatDataValue(value) {
            try {
                if (value === null || value === undefined) {
                    return '데이터 없음';
                }

                // CS17 같은 객체 배열인 경우 테이블로 표시
                if (Array.isArray(value) && value.length > 0) {
                    const firstItem = value[0];
                    if (firstItem != null && typeof firstItem === 'object' && !Array.isArray(firstItem)) {
                        const headers = Object.keys(firstItem);
                        if (headers.length > 0) {
                            let table = '<table class="cs-data-table"><thead><tr>';
                            headers.forEach(h => table += `<th>${h}</th>`);
                            table += '</tr></thead><tbody>';
                            value.forEach(row => {
                                if (row != null) {
                                    table += '<tr>';
                                    headers.forEach(h => table += `<td>${row[h] ?? '-'}</td>`);
                                    table += '</tr>';
                                }
                            });
                            table += '</tbody></table>';
                            return table;
                        }
                    }
                    // 일반 배열인 경우 (CS17.1 등)
                    return value.map(v => v ?? '-').join(', ');
                }

                // 일반 값
                return String(value);
            } catch (e) {
                console.error('formatDataValue error:', e, value);
                return String(value);
            }
        }

        // Render CS Data
        function renderCSData() {
            const grid = document.getElementById('csDataGrid');
            grid.innerHTML = csData.map(item => `
                <div class="cs-data-item ${item.value ? 'has-value' : ''} ${item.hasConflict ? 'has-conflict' : ''}">
                    <div class="cs-data-label">
                        ${item.label}
                        ${item.hasConflict ? '<span class="conflict-indicator" onclick="showConflict(\'' + item.id + '\')">충돌</span>' : ''}
                        ${!item.value && !item.hasConflict ? '<span class="missing-indicator">미확보</span>' : ''}
                    </div>
                    <div class="cs-data-value ${item.value ? '' : 'empty'} editable" onclick="editCSData('${item.id}')">
                        ${formatDataValue(item.value)}
                    </div>
                </div>
            `).join('');
        }

        // Render PH Data
        function renderPHData() {
            const list = document.getElementById('phDataList');
            list.innerHTML = phData.map(item => `
                <div class="ph-data-item ${item.value ? 'has-value' : ''}">
                    <div class="ph-data-label">${item.label}</div>
                    <div class="ph-data-value ${item.value ? '' : 'empty'}">
                        ${item.value || '서술문 데이터 없음'}
                    </div>
                </div>
            `).join('');
        }

        // Render Table Data
        function renderTableData() {
            const list = document.getElementById('tableDataList');
            list.innerHTML = tableData.map(item => `
                <div class="table-data-item ${item.hasData ? 'has-value' : ''}">
                    <div class="table-data-header">
                        <div class="table-data-label">${item.label}</div>
                        <span class="file-status ${item.hasData ? 'completed' : 'pending'}">
                            ${item.hasData ? '완료' : '대기'}
                        </span>
                    </div>
                    <div class="table-preview">
                        ${item.hasData ? renderTablePreview(item) : '<p style="color: #94a3b8; font-size: 12px;">표 데이터 없음</p>'}
                    </div>
                </div>
            `).join('');
        }

        function renderTablePreview(table) {
            if (!table.rows || table.rows.length === 0) return '<p>데이터 없음</p>';

            const headers = Object.keys(table.rows[0]);
            return `
                <table>
                    <thead>
                        <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                        ${table.rows.slice(0, 3).map(row => `
                            <tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>
                        `).join('')}
                    </tbody>
                </table>
                ${table.rows.length > 3 ? `<p style="font-size: 11px; color: #64748b; margin-top: 4px;">+ ${table.rows.length - 3}개 행 더보기</p>` : ''}
            `;
        }

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.data-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.data-section').forEach(s => s.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Section').classList.add('active');
        }

        // File selection
        function selectFile(fileId) {
            selectedFile = markdownFiles.find(f => f.id === fileId);
            renderFileList();
        }

        // Show markdown popup
        function showMarkdownPopup(fileId) {
            const file = markdownFiles.find(f => f.id === fileId);
            if (!file) return;

            document.getElementById('markdownPopupFileName').textContent = file.name;
            document.getElementById('markdownPopupRawId').textContent = file.rawId;

            const body = document.getElementById('markdownPopupBody');
            if (file.markdown && file.markdown.trim()) {
                body.textContent = file.markdown;
                body.classList.remove('markdown-empty');
            } else {
                body.innerHTML = '<div class="markdown-empty">마크다운 내용이 없습니다.</div>';
            }

            document.getElementById('markdownPopup').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close markdown popup
        function closeMarkdownPopup() {
            document.getElementById('markdownPopup').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Handle click on popup overlay (close when clicking outside)
        function handleMarkdownPopupClick(event) {
            if (event.target.id === 'markdownPopup') {
                closeMarkdownPopup();
            }
        }

        // Start extraction
        async function startExtraction() {
            const model = document.getElementById('llmModel').value;
            showLLMLoading(`${model}를 사용하여 데이터를 추출하고 있습니다...`);

            const extractionResults = [];
            const totalFiles = markdownFiles.length;
            let currentIndex = 0;

            for (const file of markdownFiles) {
                currentIndex++;
                updateLLMProgress(currentIndex, totalFiles, file.name);
                file.status = 'extracting';
                renderFileList();

                try {
                    // Extract data from markdown using dataExtractor
                    const result = await dataExtractor.extractFromMarkdown(
                        file.markdown,
                        file.rawId
                    );

                    if (result.success) {
                        extractionResults.push({
                            rawId: file.rawId,
                            fileName: file.name,
                            csData: result.csData || {},
                            phData: result.phData || {},
                            tableData: result.tableData || {},
                            extractedAt: result.extractedAt
                        });

                        file.status = 'completed';
                    } else {
                        file.status = 'error';
                        console.error(`Extraction failed for ${file.name}:`, result.error);
                    }
                } catch (error) {
                    console.error(`Extraction error for ${file.name}:`, error);
                    file.status = 'error';
                }

                renderFileList();
                updateStats();
            }

            // Merge all extracted data
            const mergedData = dataExtractor.mergeExtractedData(extractionResults);

            // Update CS Data
            Object.keys(mergedData.csData || {}).forEach(key => {
                const csItem = csData.find(d => d.id === key);
                if (csItem && mergedData.csData[key]) {
                    csItem.value = mergedData.csData[key].value;
                    csItem.source = mergedData.csData[key].source;
                }
            });

            // Update PH Data
            Object.keys(mergedData.phData || {}).forEach(key => {
                const phItem = phData.find(d => d.id === key);
                if (phItem && mergedData.phData[key]) {
                    phItem.value = mergedData.phData[key].value;
                    phItem.source = mergedData.phData[key].source;
                }
            });

            // Update Table Data
            Object.keys(mergedData.tableData || {}).forEach(key => {
                const tableItem = tableData.find(d => d.id === key);
                if (tableItem && mergedData.tableData[key]) {
                    tableItem.hasData = true;
                    tableItem.rows = mergedData.tableData[key].rows || [];
                }
            });

            // Handle conflicts
            const conflicts = dataExtractor.getConflictData();
            if (conflicts && conflicts.length > 0) {
                conflicts.forEach(conflict => {
                    const csItem = csData.find(d => d.id === conflict.field);
                    if (csItem) {
                        csItem.hasConflict = true;
                        csItem.conflictOptions = conflict.options;
                    }
                });
            }

            // Save extracted data to localStorage
            Storage.set('extractedData', {
                csData: mergedData.csData,
                phData: mergedData.phData,
                tableData: mergedData.tableData,
                extractedAt: DateHelper.formatISO()
            });

            hideLLMLoading();
            renderCSData();
            renderPHData();
            renderTableData();

            const conflictCount = conflicts ? conflicts.length : 0;
            if (conflictCount > 0) {
                showToast(`데이터 추출이 완료되었습니다. ${conflictCount}개의 충돌 데이터를 확인해주세요.`, 'warning');
            } else {
                showToast('데이터 추출이 완료되었습니다.', 'success');
            }
        }

        // Update stats
        function updateStats() {
            const completedFiles = markdownFiles.filter(f => f.status === 'completed').length;
            const csExtracted = csData.filter(d => d.value && !d.hasConflict).length;
            const phExtracted = phData.filter(d => d.value).length;
            const tableExtracted = tableData.filter(d => d.hasData).length;

            document.getElementById('completedCount').textContent = completedFiles;
            document.getElementById('totalCount').textContent = markdownFiles.length;
            document.getElementById('csExtracted').textContent = csExtracted;
            document.getElementById('phExtracted').textContent = phExtracted;
            document.getElementById('tableExtracted').textContent = tableExtracted;

            const totalData = csDataTemplate.length + phDataTemplate.length + tableDataTemplate.length;
            const extractedData = csExtracted + phExtracted + tableExtracted;
            const progressPercent = (extractedData / totalData) * 100;
            document.getElementById('progressBar').style.width = progressPercent + '%';
        }

        // Show conflict modal
        function showConflict(csId) {
            const item = csData.find(d => d.id === csId);
            if (!item || !item.hasConflict) return;

            conflictData = item;
            document.getElementById('conflictFieldName').textContent = item.label;

            const optionsHtml = item.conflictOptions.map((opt, idx) => `
                <div class="conflict-option" onclick="selectConflictOption(${idx})">
                    <div class="conflict-option-source">📄 ${opt.source} (${opt.date})</div>
                    <div class="conflict-option-value">${opt.value}</div>
                </div>
            `).join('');

            document.getElementById('conflictOptions').innerHTML = optionsHtml;
            document.getElementById('conflictModal').classList.add('show');
        }

        function selectConflictOption(index) {
            document.querySelectorAll('.conflict-option').forEach((opt, idx) => {
                if (idx === index) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }

        function closeConflictModal() {
            document.getElementById('conflictModal').classList.remove('show');
            conflictData = null;
        }

        function resolveConflict() {
            const selectedOption = document.querySelector('.conflict-option.selected');
            if (!selectedOption) {
                showToast('옵션을 선택해주세요', 'error');
                return;
            }

            const selectedIndex = Array.from(document.querySelectorAll('.conflict-option')).indexOf(selectedOption);
            const selectedValue = conflictData.conflictOptions[selectedIndex];

            conflictData.value = selectedValue.value;
            conflictData.source = selectedValue.source;
            conflictData.hasConflict = false;
            delete conflictData.conflictOptions;

            closeConflictModal();
            renderCSData();
            updateStats();
            showToast('충돌이 해결되었습니다', 'success');
        }

        // Edit CS Data
        function editCSData(csId) {
            const item = csData.find(d => d.id === csId);
            const newValue = prompt(`${item.label} 값을 입력하세요:`, item.value);

            if (newValue !== null) {
                item.value = newValue;
                item.source = 'manual_edit';
                renderCSData();
                updateStats();
            }
        }

        // Export data
        function exportData() {
            const exportData = {
                csData: csData,
                phData: phData,
                tableData: tableData,
                timestamp: new Date().toISOString()
            };

            // In real implementation, this would save to file
            console.log('Exporting data:', exportData);
            showToast('데이터가 저장되었습니다', 'success');
        }

        // PSUR 보고서 생성 (LLM 호출)
        async function generatePSURReport() {
            // API 키 확인
            const apiKey = Storage.get(CONFIG.STORAGE_KEYS.GOOGLE_API_KEY);
            if (!apiKey) {
                showToast('API 키가 설정되지 않았습니다. 설정 페이지에서 API 키를 입력해주세요.', 'error');
                return;
            }

            // PSURGenerator 초기화
            if (!window.PSURGenerator) {
                showToast('PSUR Generator 모듈이 로드되지 않았습니다.', 'error');
                return;
            }

            window.PSURGenerator.apiKey = apiKey;

            // 변환된 마크다운 로드
            const convertedMarkdowns = Storage.get('convertedMarkdowns') || [];
            if (convertedMarkdowns.length === 0) {
                showToast('변환된 마크다운 파일이 없습니다. P15에서 마크다운 변환을 먼저 수행해주세요.', 'error');
                return;
            }

            // 로딩 표시
            showLLMLoading('PSUR 보고서 생성 중... (최대 2분 소요)');

            try {
                // PSUR 보고서 생성
                const result = await window.PSURGenerator.generateFullReport({
                    convertedMarkdowns: convertedMarkdowns,
                    useTestData: true,  // 테스트 데이터 사용
                    onProgress: (progress) => {
                        console.log('[PSUR Generation]', progress.step, progress.message);
                        updateLLMProgress(0, 100, progress.message);
                    }
                });

                hideLLMLoading();

                if (result.success) {
                    const report = result.report;
                    showToast(`PSUR 보고서 생성 완료! (${report.duration}초 소요)`, 'success');
                    console.log('[PSUR Report Generated]', report);

                    // 보고서 다운로드 확인
                    if (confirm(`PSUR 보고서 생성이 완료되었습니다.\n- 소요 시간: ${report.duration}초\n- 원본 파일: ${report.sourceFiles}개\n\n보고서를 다운로드 하시겠습니까?`)) {
                        window.PSURGenerator.downloadReport();
                    }
                } else {
                    showToast(`PSUR 생성 실패: ${result.error}`, 'error');
                    console.error('[PSUR Generation Failed]', result.error);
                }

            } catch (error) {
                hideLLMLoading();
                showToast(`오류 발생: ${error.message}`, 'error');
                console.error('[PSUR Generation Error]', error);
            }
        }

        // Proceed to next stage
        function proceedToNext() {
            const missingCS = csData.filter(d => !d.value).length;
            const conflicts = csData.filter(d => d.hasConflict).length;

            if (missingCS > 0 || conflicts > 0) {
                showToast(`미확보 데이터 ${missingCS}개, 충돌 ${conflicts}개를 먼저 해결해주세요`, 'error');
                return;
            }

            // Ensure extracted data is saved
            Storage.set('extractedData', {
                csData: Object.fromEntries(csData.map(d => [d.id, { value: d.value, source: d.source }])),
                phData: Object.fromEntries(phData.map(d => [d.id, { value: d.value, source: d.source }])),
                tableData: Object.fromEntries(tableData.map(d => [d.id, { hasData: d.hasData, rows: d.rows }])),
                extractedAt: DateHelper.formatISO()
            });

            const reportId = new URLSearchParams(window.location.search).get('reportId') || Date.now().toString();
            window.location.href = `P17_TemplateWriting.html?reportId=${reportId}`;
        }

        // Initialize on load
        init();
    </script>
