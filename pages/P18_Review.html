<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-18 Review - KPSUR AGENT</title>
    <link rel="stylesheet" href="../css/styles/globals.css">
    <link rel="stylesheet" href="../css/styles/layout.css">
    <link rel="stylesheet" href="../css/styles/components.css">
    <style>
        /* ========== Glassmorphism Review Page Styles ========== */

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Review Container */
        .review-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            padding: 24px;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Left Panel - Section Navigation */
        .section-nav-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 20px;
            overflow-y: auto;
            box-shadow: var(--glass-shadow);
            animation: fadeInUp 0.5s ease both;
            max-height: calc(100vh - 200px);
        }

        .section-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .section-nav-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-progress {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border);
        }

        .section-nav-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section-nav-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(31, 78, 140, 0.15);
            border-color: rgba(31, 78, 140, 0.3);
        }

        .section-nav-item.active {
            background: linear-gradient(135deg, rgba(31, 78, 140, 0.2), rgba(31, 78, 140, 0.1));
            border-left-color: var(--color-primary);
            box-shadow: 0 4px 16px rgba(31, 78, 140, 0.2);
        }

        .section-nav-item.edited {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 191, 36, 0.05));
            border-left-color: #fbbf24;
        }

        .section-nav-item.reviewed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border-left-color: #10B981;
        }

        .section-nav-number {
            font-size: 11px;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-nav-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .section-nav-status {
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 10px;
            backdrop-filter: blur(8px);
        }

        .status-badge.pending {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-secondary);
        }

        .status-badge.edited {
            background: rgba(251, 191, 36, 0.2);
            color: #d97706;
        }

        .status-badge.reviewed {
            background: rgba(16, 185, 129, 0.2);
            color: #059669;
        }

        /* Main Panel - Review Editor */
        .review-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            animation: fadeInUp 0.5s ease 0.1s both;
        }

        .review-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(135deg, rgba(31, 78, 140, 0.08), rgba(31, 78, 140, 0.02));
        }

        .review-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .review-info {
            background: linear-gradient(135deg, rgba(31, 78, 140, 0.12), rgba(31, 78, 140, 0.06));
            border-left: 4px solid var(--color-primary);
            padding: 14px 16px;
            margin-bottom: 16px;
            border-radius: var(--radius-lg);
            backdrop-filter: blur(8px);
        }

        .review-info-text {
            font-size: 12px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .review-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .review-controls-left,
        .review-controls-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .view-mode-toggle {
            display: flex;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .view-mode-btn {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-mode-btn:hover {
            color: var(--color-primary);
        }

        .view-mode-btn.active {
            background: var(--gradient-primary);
            color: white;
        }

        .review-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            overflow-y: auto;
            background: rgba(248, 250, 252, 0.3);
        }

        .review-content.single-view {
            grid-template-columns: 1fr;
        }

        .review-column {
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }

        .column-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            padding: 6px 12px;
            font-size: 11px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .icon-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(31, 78, 140, 0.2);
        }

        .markdown-viewer {
            flex: 1;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.7;
            padding: 20px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            background: rgba(248, 250, 252, 0.8);
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .document-editor {
            flex: 1;
            padding: 24px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            overflow-y: auto;
            line-height: 1.8;
            transition: all 0.3s ease;
        }

        .document-editor[contenteditable="true"] {
            outline: none;
            cursor: text;
        }

        .document-editor[contenteditable="true"]:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(31, 78, 140, 0.1), var(--glass-shadow);
        }

        .document-editor h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--glass-border);
        }

        .document-editor h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-primary);
            margin: 24px 0 14px 0;
        }

        .document-editor h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 18px 0 10px 0;
        }

        .document-editor p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .document-editor table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 13px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
        }

        .document-editor th {
            background: var(--gradient-primary);
            color: white;
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
        }

        .document-editor td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.6);
        }

        .document-editor tr:hover td {
            background: rgba(31, 78, 140, 0.05);
        }

        .change-indicator {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.1));
            border-left: 3px solid #fbbf24;
            padding: 4px 8px;
            margin: 4px 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        /* Action Footer */
        .review-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--glass-border);
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.9), rgba(241, 245, 249, 0.9));
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-info {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .change-count {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.1));
            color: #d97706;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        /* Change History Panel */
        .change-history-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-left: 1px solid var(--glass-border);
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            padding: 24px;
            overflow-y: auto;
        }

        .change-history-panel.show {
            display: block;
            animation: slideInRight 0.3s ease;
        }

        .change-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--glass-border);
        }

        .change-history-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .change-item {
            padding: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            border-left: 4px solid #fbbf24;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .change-item:hover {
            transform: translateX(-4px);
            box-shadow: var(--glass-shadow);
        }

        .change-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .change-before {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
            padding: 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            margin-bottom: 8px;
            text-decoration: line-through;
            color: #dc2626;
        }

        .change-after {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            padding: 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            color: #059669;
        }

        /* Export Modal */
        .export-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .export-modal.show {
            display: flex;
        }

        .export-modal-content {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 480px;
            padding: 28px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.3s ease;
        }

        .export-modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .export-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .export-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .export-option:hover {
            border-color: var(--color-primary);
            background: rgba(31, 78, 140, 0.05);
        }

        .export-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Markdown Files Section */
        .markdown-files-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .markdown-files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .markdown-files-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .markdown-files-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border);
        }

        .markdown-file-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .markdown-file-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(31, 78, 140, 0.15);
            border-color: rgba(31, 78, 140, 0.3);
        }

        .markdown-file-icon {
            font-size: 16px;
        }

        .markdown-file-name {
            font-size: 12px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-weight: 500;
        }

        .markdown-file-rawid {
            font-size: 9px;
            padding: 3px 8px;
            background: var(--gradient-primary);
            color: white;
            border-radius: var(--radius-full);
            font-weight: 600;
        }

        /* Markdown Popup */
        .markdown-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .markdown-popup-overlay.show {
            display: flex;
        }

        .markdown-popup {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.3s ease;
        }

        .markdown-popup-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(31, 78, 140, 0.08), rgba(31, 78, 140, 0.02));
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        .markdown-popup-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .markdown-popup-close {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }

        .markdown-popup-close:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #dc2626;
        }

        .markdown-popup-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .markdown-popup-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.9), rgba(241, 245, 249, 0.9));
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] .section-nav-panel,
        [data-theme="dark"] .review-panel {
            background: rgba(28, 28, 28, 0.8);
            border-color: rgba(80, 80, 80, 0.4);
        }

        [data-theme="dark"] .section-nav-item {
            background: rgba(50, 50, 50, 0.6);
            border-color: rgba(80, 80, 80, 0.4);
        }

        [data-theme="dark"] .section-nav-item:hover {
            background: rgba(80, 80, 80, 0.7);
        }

        [data-theme="dark"] .section-nav-item.active {
            background: rgba(80, 80, 80, 0.5);
            border-left-color: #e5e5e5;
        }

        [data-theme="dark"] .markdown-viewer,
        [data-theme="dark"] .document-editor {
            background: rgba(28, 28, 28, 0.9);
            border-color: rgba(80, 80, 80, 0.4);
        }

        [data-theme="dark"] .review-content {
            background: rgba(20, 20, 20, 0.3);
        }

        [data-theme="dark"] .review-header,
        [data-theme="dark"] .review-footer {
            background: rgba(28, 28, 28, 0.9);
        }

        [data-theme="dark"] .change-history-panel,
        [data-theme="dark"] .export-modal-content,
        [data-theme="dark"] .markdown-popup {
            background: rgba(28, 28, 28, 0.95);
            border-color: rgba(80, 80, 80, 0.5);
        }

        [data-theme="dark"] .status-badge.edited {
            color: #fbbf24;
        }

        [data-theme="dark"] .status-badge.reviewed {
            color: #34d399;
        }

        [data-theme="dark"] .markdown-file-item {
            background: rgba(50, 50, 50, 0.6);
            border-color: rgba(80, 80, 80, 0.4);
        }

        [data-theme="dark"] .markdown-file-item:hover {
            background: rgba(80, 80, 80, 0.7);
        }

        /* MD View Modal Styles */
        .md-view-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .md-view-modal.show {
            display: flex;
        }

        .md-view-container {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            width: 95%;
            max-width: 1400px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.3s ease;
        }

        .md-view-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(31, 78, 140, 0.08), rgba(31, 78, 140, 0.02));

                set: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } },
                remove: (key) => { try { localStorage.removeItem(key); return true; } catch { return false; } }
            };

        if (!window.DateHelper) {
            window.DateHelper = {
                format: (date, format = 'YYYY-MM-DD') => {
                    const d = new Date(date);
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const hours = String(d.getHours()).padStart(2, '0');
                    const minutes = String(d.getMinutes()).padStart(2, '0');
                    return format.replace('YYYY', year).replace('MM', month).replace('DD', day).replace('HH', hours).replace('mm', minutes);
                },
                formatISO: (date = new Date()) => date.toISOString(),
                now: () => new Date().toISOString()
            };

        // AppLayout stub class
        class AppLayout {
            constructor(options = {}) {

                this.reportName = options.reportName || '';
            }

            render(content) {
                return content;

        // reviewManager stub
        const reviewManager = {
            save: async () => ({ success: true }),
            load: async () => ({})
        };

        // authManager fallback (auth.js에서 이미 선언된 경우 재선언하지 않음)
        if (!window.authManager) {
            window.authManager = {
                isAuthenticated: () => true,
                getUser: () => ({ name: '관리자', role: 'Admin' })
            };
        }

        // URL에서 reportId 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('reportId');
        console.log('[P18] Report ID from URL:', reportId);

        // Load draft report from P17 (localStorage fallback)
        const draftReport = Storage.get('draftReport') || {};
        let generatedSections = draftReport.sections || {};

        // DB에서 섹션 로드 함수
        async function loadSectionsFromDB() {
            if (!reportId) {
                console.log('[P18] No reportId, using localStorage');
                return;
            }

            try {
                // supabaseClient 대기
                if (typeof window.supabaseClient === 'undefined') {
                    // 동적 import 시도
                    const module = await import('../js/supabase-client.js');
                    window.supabaseClient = module.default;
                }

                if (!window.supabaseClient) {
                    console.warn('[P18] supabaseClient not available');
                    return;
                }

                const result = await window.supabaseClient.getSections(reportId);

                if (result.success && result.sections && result.sections.length > 0) {
                    console.log(`[P18] ✅ Loaded ${result.sections.length} sections from DB`);

                    // DB 데이터를 로컬 형식으로 변환
                    result.sections.forEach(dbSection => {
                        const sectionId = `S${dbSection.section_number}`;
                        generatedSections[sectionId] = {
                            content: dbSection.content_markdown,
                            name: dbSection.section_name,
                            dbId: dbSection.id,
                            version: dbSection.version
                        };
                    });

                    // sectionContents 업데이트
                    sections.forEach(section => {
                        const content = generatedSections[section.id]?.content || '';
                        sectionContents[section.id] = {
                            markdown: content,
                            html: convertMarkdownToHTML(content)
                        };
                    });

                    // UI 갱신
                    loadSectionContent();
                    renderSectionNav();
                }
            } catch (error) {
                console.error('[P18] DB load error:', error);
            }
        }

        // 섹션 DB 저장 함수
        async function saveSectionToDB(sectionNumber, content, name) {
            if (!reportId || !window.supabaseClient) {
                console.log('[P18] No reportId or supabaseClient, skipping DB save');
                return;
            }

            try {
                const result = await window.supabaseClient.upsertSection(reportId, sectionNumber, {
                    name: name,
                    content: content
                });

                if (result.success) {
                    console.log(`[P18] ✅ Section ${sectionNumber} saved to DB`);
                }
            } catch (error) {
                console.error('[P18] DB save error:', error);
            }
        }

        // Load markdown files from convertedMarkdowns (Stage 2 결과)
        const convertedMarkdowns = Storage.get('convertedMarkdowns') || {};
        const uploadedFiles = Storage.get('uploadedFiles') || [];

        // Convert markdowns object to array for easier handling
        const markdownFiles = Object.keys(convertedMarkdowns).map(filename => {
            // uploadedFiles에서 RAW ID 찾기
            const fileInfo = uploadedFiles.find(f => f.name === filename) || {};
            return {
                name: filename,
                markdown: convertedMarkdowns[filename] || '',
                rawId: fileInfo.rawId || fileInfo.raw_id || ''
            };
        });

        // Section data - PSUR/PBRER 표준 구조
        const sections = [

        function convertMarkdownToHTML(markdown) {
            if (!markdown) return '';
            let html = markdown;

            // XSS 방지: HTML 엔티티 이스케이프
            html = html.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');

            // 코드 블록 (트리플 백틱)
            html = html.replace(/```(\w*)\n([\s\S]*?)```/gm, (match, lang, code) => {
                return `<pre class="md-code-block"><code class="language-${lang}">${code.trim()}</code></pre>`;
            });

            // 인라인 코드
            html = html.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');

            // 헤더 (h3, h2, h1 순서로)
            html = html.replace(/^### (.+)$/gm, '<h3 class="md-h3">$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2 class="md-h2">$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1 class="md-h1">$1</h1>');

            // 강조 (볼드 + 이탤릭)
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');

            // 테이블 처리
            html = html.replace(/^\|(.+)\|$/gm, (match, content) => {
                const cells = content.split('|').map(c => c.trim());
                // 구분선 행 체크 (---|---|---)
                if (cells.every(c => /^[-:]+$/.test(c))) {
                    return '<!-- table-separator -->';
                }
                const cellHtml = cells.map(c => `<td class="md-td">${c}</td>`).join('');
                return `<tr class="md-tr">${cellHtml}</tr>`;
            });

            // 연속된 tr을 table로 감싸기
            html = html.replace(/((?:<tr class="md-tr">.*?<\/tr>\n?)+)/g, (match) => {
                let tableContent = match.replace(/<!-- table-separator -->\n?/g, '');
                // 첫 번째 행을 헤더로 변환
                tableContent = tableContent.replace(/<tr class="md-tr">(.*?)<\/tr>/,
                    (m, cells) => `<thead><tr class="md-tr">${cells.replace(/md-td/g, 'md-th')}</tr></thead><tbody>`);
                tableContent += '</tbody>';
                return `<table class="md-table">${tableContent}</table>`;
            });

            // 비순서 리스트
            html = html.replace(/^- (.+)$/gm, '<li class="md-li">$1</li>');
            html = html.replace(/((?:<li class="md-li">.*?<\/li>\n?)+)/g, '<ul class="md-ul">$1</ul>');

            // 순서 리스트
            html = html.replace(/^\d+\. (.+)$/gm, '<li class="md-li-ordered">$1</li>');
            html = html.replace(/((?:<li class="md-li-ordered">.*?<\/li>\n?)+)/g, '<ol class="md-ol">$1</ol>');

            // 인용문
            html = html.replace(/^&gt; (.+)$/gm, '<blockquote class="md-blockquote">$1</blockquote>');

            // 수평선
            html = html.replace(/^---$/gm, '<hr class="md-hr">');

            // 링크
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="md-link" target="_blank">$1</a>');

            // 단락 처리
            html = html.replace(/\n\n/g, '</p><p class="md-p">');
            html = `<div class="md-content"><p class="md-p">${html}</p></div>`;

            // 빈 단락 정리
            html = html.replace(/<p class="md-p"><\/p>/g, '');
            html = html.replace(/<p class="md-p">\s*<\/p>/g, '');

            return html;
        }

                const ext = filename.split('.').pop().toLowerCase();

                if (ext === 'docx' || ext === 'doc') return '📝';

                    ${file.rawId ? `<span class="markdown-file-rawid">${file.rawId}</span>` : ''}

            listContainer.innerHTML = filesHtml;

                    </div>
                `;
                return;
            }

            // 파일 타입별 아이콘
            const getFileIcon = (filename) => {
                const ext = filename.split('.').pop().toLowerCase();
                if (ext === 'pdf') return '📕';
                if (ext === 'xlsx' || ext === 'xls') return '📗';
                if (ext === 'docx' || ext === 'doc') return '📘';
                return '📄';
            };

            // 파일 크기 표시 (마크다운 길이 기반)
            const getFileSize = (markdown) => {
                const bytes = new Blob([markdown]).size;
                if (bytes < 1024) return `${bytes} B`;
                if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
                return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
            };

            const filesHtml = markdownFiles.map((file, index) => `
                <div class="md-view-file-item ${currentMdViewFileIndex === index ? 'active' : ''}"
                     onclick="selectMdViewFile(${index})"

                        </div>
                    </div>
                </div>
            `).join('');

            listContainer.innerHTML = filesHtml;

        // MD View 파일 선택

            else if (ext === 'xlsx' || ext === 'xls') icon = '📗';
            else if (ext === 'docx' || ext === 'doc') icon = '📘';

            contentTitle.innerHTML = `<span>${icon}</span><span>${file.name}</span>`;

            // 마크다운 내용 설정
            if (file.markdown && file.markdown.trim()) {
                markdownContainer.className = 'md-view-markdown md-rendered';

        // MD View 내용 다운로드
        function downloadMdViewContent() {
            if (currentMdViewFileIndex < 0) return;

            const file = markdownFiles[currentMdViewFileIndex];
            if (!file) return;

            const content = file.markdown || '';
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = file.name.replace(/\.[^.]+$/, '.md');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('마크다운 파일이 다운로드되었습니다', 'success');
        }

                html: `<h1>${currentSection.number}. ${currentSection.name}</h1><p>내용이 준비 중입니다...</p>`

        function trackChange() {
            const currentContent = document.getElementById('documentEditor').innerHTML;
            if (currentContent !== originalContent) {
                currentSection.hasChanges = true;
                currentSection.status = 'edited';
                document.getElementById('sectionChangeCount').textContent = '수정됨';
                document.getElementById('sectionChangeCount').style.display = 'inline-block';

        // Save section
        function saveSection() {
            const editedContent = document.getElementById('documentEditor').innerHTML;

            if (!currentSection.hasChanges) {
                showToast('변경사항이 없습니다', 'info');
                return;
            }

            // Record change in history
            const change = {
                id: changeHistory.length + 1,
                timestamp: new Date().toISOString(),
                section: `${currentSection.number}. ${currentSection.name}`,
                editor: '홍길동',
                before: originalContent,
                after: editedContent
            };

            changeHistory.push(change);

            // Update section status
            currentSection.status = 'reviewed';
            currentSection.hasChanges = false;
            originalContent = editedContent;

            document.getElementById('sectionChangeCount').textContent = '저장됨';
            document.getElementById('sectionChangeCount').style.display = 'none';

            renderSectionNav();
            updateStats();
            showToast('섹션이 저장되었습니다', 'success');

            // DB에 섹션 저장
            saveSectionToDB(currentSection.number, editedContent, currentSection.name);
            console.log('Saving change to database:', change);

        // Reset section to original
        function resetSection() {
            if (!confirm('현재 섹션을 원본으로 복원하시겠습니까? 변경사항이 모두 손실됩니다.')) {
                return;
            }

            loadSectionContent();
            currentSection.status = 'pending';
            currentSection.hasChanges = false;
            renderSectionNav();
            showToast('원본으로 복원되었습니다', 'info');
        }

        // View mode toggle
        function setViewMode(mode) {
            viewMode = mode;

            const reviewContent = document.getElementById('reviewContent');
            const markdownColumn = document.getElementById('markdownColumn');

            document.querySelectorAll('.view-mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'single') {
                reviewContent.classList.add('single-view');
                markdownColumn.style.display = 'none';
            } else {
                reviewContent.classList.remove('single-view');
                markdownColumn.style.display = 'flex';
            }
        }

        // Toggle edit mode
        function toggleEdit() {
            const editor = document.getElementById('documentEditor');
            const isEditable = editor.contentEditable === 'true';

            editor.contentEditable = !isEditable;
            document.getElementById('editToggleIcon').textContent = isEditable ? '🔒' : '🔓';
            document.getElementById('editToggleText').textContent = isEditable ? '편집 잠금' : '편집 중';

            if (isEditable) {
                editor.style.cursor = 'default';
            } else {
                editor.style.cursor = 'text';
            }
        }

        // Navigation
        function previousSection() {
            const currentIndex = sections.findIndex(s => s.id === currentSection.id);
            if (currentIndex > 0) {
                selectSection(sections[currentIndex - 1]);
            }
        }

        function saveAndNext() {
            saveSection();

            const currentIndex = sections.findIndex(s => s.id === currentSection.id);
            if (currentIndex < sections.length - 1) {
                selectSection(sections[currentIndex + 1]);
            }
        }

        // Copy markdown
        function copyMarkdown() {
            const markdown = document.getElementById('markdownViewer').textContent;
            navigator.clipboard.writeText(markdown).then(() => {
                showToast('마크다운이 복사되었습니다', 'success');
            });
        }

        // Change history
        function showChangeHistory() {
            renderChangeHistory();
            document.getElementById('changeHistoryPanel').classList.add('show');
        }

        function closeChangeHistory() {
            document.getElementById('changeHistoryPanel').classList.remove('show');
        }

        function renderChangeHistory() {
            if (changeHistory.length === 0) {
                document.getElementById('changeHistoryList').innerHTML = `
                    <p style="color: #94a3b8; font-size: 13px; text-align: center; margin-top: 40px;">
                        변경 이력이 없습니다
                    </p>
                `;
                return;
            }

            const historyHtml = changeHistory.reverse().map(change => `
                <div class="change-item">
                    <div class="change-meta">
                        ${new Date(change.timestamp).toLocaleString('ko-KR')} | ${change.editor} | ${change.section}
                    </div>
                    <div class="change-before">이전: ${change.before.substring(0, 100)}...</div>
                    <div class="change-after">이후: ${change.after.substring(0, 100)}...</div>
                </div>
            `).join('');

            document.getElementById('changeHistoryList').innerHTML = historyHtml;
        }

        // Merge all sections
        function mergeAll() {
            showLLMLoading('모든 섹션을 병합하고 있습니다...');

            setTimeout(() => {
                hideLLMLoading();
                showToast('모든 섹션이 병합되었습니다', 'success');
            }, 2000);
        }

        // Export modal
        function showExportModal() {
            document.getElementById('exportModal').classList.add('show');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('show');
        }

        function confirmExport() {
            const merge = document.getElementById('exportMerge').checked;
            const draft = document.getElementById('exportDraft').checked;
            const format = document.querySelector('input[name="exportFormat"]:checked').value;

            const fileName = `testPill_1${draft ? '_Draft' : ''}.${format}`;

            showLLMLoading(`문서를 ${format.toUpperCase()} 형식으로 내보내는 중...`);

            setTimeout(() => {
                hideLLMLoading();
                closeExportModal();
                showToast(`${fileName} 파일이 생성되었습니다`, 'success');
            }, 2000);
        }

        // Proceed to QC
        async function proceedToQC() {
            const allReviewed = sections.every(s => s.status === 'reviewed');

            if (!allReviewed) {
                const pendingCount = sections.filter(s => s.status !== 'reviewed').length;
                if (!confirm(`${pendingCount}개 섹션이 아직 검토되지 않았습니다. QC 단계로 진행하시겠습니까?`)) {
                    return;
                }
            }

            // End review session and save changes
            if (reviewManager.getCurrentSession()) {
                const result = await reviewManager.endReviewSession();
                if (result.success) {
                    console.log('Review session ended successfully');
                }
            }

            // Save reviewed sections to localStorage
            const reviewedSections = {};
            sections.forEach(section => {
                const content = sectionContents[section.id];
                if (content) {
                    reviewedSections[section.id] = {
                        ...content,
                        status: section.status,
                        reviewedAt: DateHelper.formatISO()
                    };
                }
            });

            Storage.set('reviewedSections', reviewedSections);
            Storage.set('reviewChangeHistory', changeHistory);

            const reportId = new URLSearchParams(window.location.search).get('reportId') || Date.now().toString();
            window.location.href = `P19_QC.html?reportId=${reportId}`;
        }

        // Update statistics
        function updateStats() {
            const reviewedCount = sections.filter(s => s.status === 'reviewed').length;
            document.getElementById('reviewedCount').textContent = reviewedCount;
            document.getElementById('changeCount').textContent = changeHistory.length;
        }

        // Initialize on load
        init();
    </script>
</body>

</html>
