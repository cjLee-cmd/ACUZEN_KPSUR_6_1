<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - KPSUR AGENT | ACUZEN AI</title>
    <link rel="stylesheet" href="../css/styles/globals.css">
    <style>
        :root {
            --bg-gradient-1: #07161D;
            --bg-gradient-2: #122E4E;
            --bg-gradient-3: #12305B;
            --card-bg: rgba(255, 255, 255, 0.98);
            --card-shadow: rgba(0, 0, 0, 0.3);
            --text-primary: #1F2937;
            --text-secondary: var(--app-text-normal);
            --text-label: var(--app-text-strong);
            --input-bg: white;
            --input-border: var(--app-border-soft);
            --divider: var(--app-border-soft);
            --copyright: rgba(255, 255, 255, 0.7);
        }

        [data-theme="dark"] {
            --bg-gradient-1: #121212;
            --bg-gradient-2: #1e1e1e;
            --bg-gradient-3: #252525;
            --card-bg: rgba(40, 40, 40, 0.98);
            --card-shadow: rgba(0, 0, 0, 0.5);
            --text-primary: #FFFFFF;
            --text-secondary: #D4D4D4;
            --text-label: #E5E5E5;
            --input-bg: #2a2a2a;
            --input-border: #404040;
            --divider: #404040;
            --copyright: rgba(255, 255, 255, 0.6);
        }

        /* 다크모드 토글 버튼 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(31, 78, 140, 0.3);
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .theme-toggle {
            background: #2a2a2a;
            border-color: rgba(160, 160, 160, 0.3);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px var(--card-shadow);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            transition: all 0.3s ease;
        }

        .theme-toggle .sun-icon {
            color: #f59e0b;
            display: none;
        }

        .theme-toggle .moon-icon {
            color: #6366f1;
        }

        [data-theme="dark"] .theme-toggle .sun-icon {
            display: block;
        }

        [data-theme="dark"] .theme-toggle .moon-icon {
            display: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 배경 애니메이션 효과 */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 141, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(31, 78, 140, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, 50px) scale(1.1);
            }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px var(--card-shadow),
                0 0 40px rgba(90, 141, 255, 0.2);
            backdrop-filter: blur(10px);
            animation: slideIn 0.5s ease-out;
        }

        [data-theme="dark"] .login-card {
            box-shadow: 0 20px 60px var(--card-shadow);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #12305B 0%, #1F4E8C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 13px;
            color: var(--app-text-normal);
            font-weight: 500;
        }

        .medical-badge {
            display: inline-block;
            background: linear-gradient(135deg, #12305B 0%, #1F4E8C 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .version-badge {
            display: block;
            color: #64748B;
            font-size: 11px;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:focus {
            border-color: #12305B;
            box-shadow: 0 0 0 4px rgba(31, 78, 140, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #12305B 0%, #1F4E8C 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(31, 78, 140, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Google 로그인 버튼 */
        .social-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 16px;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider);
        }

        .social-divider span {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }

        .btn-google {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            color: var(--text-primary);
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-google:hover {
            border-color: #4285f4;
            background: rgba(66, 133, 244, 0.05);
            transform: translateY(-1px);
        }

        .btn-google:active {
            transform: translateY(0);
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .links-section {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--divider);
        }

        .link {
            color: #12305B;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .link:hover {
            color: #1F4E8C;
            text-decoration: underline;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #12305B;
        }

        .remember-me label {
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .copyright {
            text-align: center;
            margin-top: 32px;
            color: var(--copyright);
            font-size: 11px;
            font-weight: 400;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #DC2626;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #059669;
        }

        /* 로딩 스피너 */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        .btn-primary.loading .loading-spinner {
            display: block;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 24px;
            }

            .logo-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <script src="../js/mono-icons.js" data-icon-sprite="../assets/icons/mono-icons.svg"></script>
    <!-- 다크모드 토글 버튼 -->
    <button class="theme-toggle" id="themeToggle" aria-label="테마 변경">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
                d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
                d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
        </svg>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-title">KPSUR AGENT</div>
                <div class="logo-subtitle">ACUZEN AI | <span id="headerVersion"></span></div>
                <span class="medical-badge">의료용 AI 소프트웨어</span>
                <span class="version-badge" id="badgeVersion"></span>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">이메일</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="이메일을 입력하세요" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요"
                        required autocomplete="current-password">
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">로그인 상태 유지</label>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">로그인</span>
                    <div class="loading-spinner"></div>
                </button>
            </form>

            <!-- 소셜 로그인 -->
            <div class="social-divider">
                <span>또는</span>
            </div>

            <button type="button" class="btn-google" id="googleLoginBtn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Google 계정으로 로그인
            </button>

            <div class="links-section">
                <a href="P02_Signup.html" class="link">회원가입</a>
                <a href="P03_PasswordReset.html" class="link">비밀번호 찾기</a>
            </div>

            <div
                style="text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--app-border-soft);">
                <a href="P90_SystemTest.html" class="link" style="font-size: 12px; color: var(--app-text-muted);">
                    🔧 시스템 테스트
                </a>
            </div>
        </div>

        <div class="copyright">
            Copyright. Power Solution., Inc. 2026.
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Core JS 로드 (전역 스크립트) -->
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>

    <!-- Security & Navigation -->
    <script src="../utils/session.js"></script>
    <script src="../utils/navigation.js"></script>

    <script>
        // 앱 버전 (머지할 때마다 최하위 버전 증가)
        const APP_VERSION = 'v.0.1.2.';

        // 버전 표시 초기화
        document.getElementById('headerVersion').textContent = APP_VERSION;
        document.getElementById('badgeVersion').textContent = APP_VERSION;

        // 전역 변수 참조 (config.js에서 이미 선언된 경우 재선언하지 않음)
        if (!window.CONFIG) {
            window.CONFIG = { PAGES: { SYSTEM_CHECK: 'P05_SystemCheck.html' } };
        }
        // authManager는 auth.js에서 window.authManager로 설정됨

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // 로딩 시작
            loginBtn.classList.add('loading');

            try {
                // AuthManager를 통한 로그인
                const result = await window.authManager.login(email, password, remember);

                if (result.success) {
                    showAlert('로그인 성공! 시스템 점검 중...', 'success');

                    // 네비게이션 플래그 설정 (리프레시 보안용)
                    if (typeof setNavigationFlag === 'function') {
                        setNavigationFlag();
                    }

                    // 시스템 체크 페이지로 이동
                    setTimeout(() => {
                        window.location.href = window.CONFIG.PAGES.SYSTEM_CHECK;
                    }, 1000);
                } else {
                    showAlert(result.error || '이메일 또는 비밀번호가 올바르지 않습니다.', 'error');
                    loginBtn.classList.remove('loading');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('로그인 중 오류가 발생했습니다.', 'error');
                loginBtn.classList.remove('loading');
            }
        });

        // 엔터키로 폼 제출
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                loginForm.requestSubmit();
            }
        });

        // Google 로그인 버튼 핸들러
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                const googleBtn = document.getElementById('googleLoginBtn');
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<div class="loading-spinner" style="display:block;"></div>';

                // Supabase Google OAuth 호출
                if (window.supabaseClient) {
                    const result = await window.supabaseClient.signInWithGoogle();
                    if (!result.success) {
                        showAlert(result.error || 'Google 로그인에 실패했습니다.', 'error');
                        googleBtn.disabled = false;
                        googleBtn.innerHTML = `
                            <svg viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Google 계정으로 로그인
                        `;
                    }
                    // OAuth는 리다이렉트되므로 성공시 여기에 도달하지 않음
                } else {
                    showAlert('Supabase 클라이언트가 초기화되지 않았습니다.', 'error');
                    googleBtn.disabled = false;
                }
            } catch (error) {
                console.error('Google login error:', error);
                showAlert('Google 로그인 중 오류가 발생했습니다.', 'error');
            }
        });

        // 다크모드 토글 기능
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        document.getElementById('themeToggle').addEventListener('click', function () {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>

</html>
